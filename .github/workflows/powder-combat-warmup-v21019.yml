name: Powder Combat Warmup

on:
  push:
    branches:
      - main
      - upgrade/21.0.19-combat-warmup-zero-stutter
  pull_request:

permissions:
  contents: read

jobs:
  combat-warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Chrome
        run: google-chrome --version
      - name: Run combat warmup gate
        run: node tools/powder-combat-warmup-gate-v21019.mjs .
      - name: Upload combat warmup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powder-combat-warmup-${{ github.sha }}
          path: artifacts/combat-warmup-v21019/
          if-no-files-found: warn
          retention-days: 14
