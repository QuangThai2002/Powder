name: Powder 21.1.2 Finalize

on:
  push:
    branches: [upgrade/21.1.2-learning-question-engine]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v2112-finalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/21.1.2-learning-question-engine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Integrate Learning Question Engine 4.0
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          // Keep the registry honest: both interaction archetypes that are generated at runtime are first-class registry entries.
          {
            const f='js/learning-question-engine-v2112.js';
            let s=fs.readFileSync(f,'utf8');
            const a="synonym_recognition'],";
            if(s.includes(a))s=s.replace(a,"synonym_recognition','match_term_meaning','multi_correct_pairs'],");
            else if(!s.includes("'match_term_meaning','multi_correct_pairs'"))throw new Error('LQE registry anchor missing');
            fs.writeFileSync(f,s);
          }
          // Patch only the lesson session in app.js. Boss/SRS/promotion renderers stay canonical/legacy.
          {
            const f='js/app.js';
            let s=fs.readFileSync(f,'utf8');
            const poolOld="raw=LM?.activeQuestions?.(l.questions)||[],questionPool=expandLessonPoolV1796(raw),questions=selectCoreLessonQuestionsLocal(l,questionPool),questionRange=lessonQuestionRange(l),difficultyLabel=lessonDifficultyLabel(l);";
            const poolNew="raw=LM?.activeQuestions?.(l.questions)||[],questionRange=lessonQuestionRange(l),academic=window.POWDER_LEARNING_QUESTION_ENGINE_V2112,questionPool=academic?.buildLessonPool?.(l,raw,P)||expandLessonPoolV1796(raw),questions=academic?.selectSessionQuestions?.(P,l,questionPool,questionRange)||selectCoreLessonQuestionsLocal(l,questionPool),difficultyLabel=lessonDifficultyLabel(l);";
            if(s.includes(poolOld))s=s.replace(poolOld,poolNew);else if(!s.includes('academic?.buildLessonPool?.(l,raw,P)'))throw new Error('openLesson pool anchor missing');
            const candOld="candidateQuestionIds:questionPool.map(q=>String(q.id||'')).filter(Boolean)";
            const candNew="candidateQuestionIds:raw.map(q=>String(q.id||'')).filter(Boolean)";
            if(s.includes(candOld))s=s.replace(candOld,candNew);else if(!s.includes(candNew))throw new Error('canonical candidate ID anchor missing');
            const showStart=s.indexOf('function showLessonQuestion(){'),showEnd=s.indexOf('function questionTypeLabel',showStart);
            if(showStart<0||showEnd<0)throw new Error('showLessonQuestion boundaries missing');
            const show=`function lessonAcademicResponseReady(v,q){const mode=q?.academicMeta?.interaction||'choice';if(mode==='multi'||mode==='order')return Array.isArray(v)&&v.length>0;if(mode==='match'){const need=(q.matchLeft||Object.keys(q.answer||{})).length,vals=v&&typeof v==='object'?Object.values(v):[];return need>0&&Object.keys(v||{}).length>=need&&vals.every(x=>String(x||'').trim())}return String(v??'').trim().length>0}function showLessonQuestion(){const s=lessonSession,q=s.questions[s.index],academic=window.POWDER_LEARNING_QUESTION_ENGINE_V2112,typeLabel=academic&&q.academicMeta?academic.label(q):questionTypeLabel(q.type);s.questionStartedAt=Date.now();s.selected=null;s.getResponse=null;$('#lessonBody').innerHTML=\`<div class="lesson-quiz-progress"><span>Câu <b>\${s.index+1}/\${s.questions.length}</b></span><span>\${s.difficultyLabel||'Bài học'} · \${typeLabel}</span><span>✓ Có đáp án & giải thích sau khi xác nhận</span></div><p class="question-prompt">\${q.prompt}</p><div id="lessonOptions" class="question-options"></div><div id="lessonFeedback" class="feedback" aria-live="polite"></div>\`;resetLessonScroll();$('#lessonActionBtn').textContent='Xác nhận';$('#lessonActionBtn').disabled=true;const box=$('#lessonOptions');if(academic&&q.academicMeta){s.getResponse=academic.mount(box,q,response=>{s.selected=response;$('#lessonActionBtn').disabled=!lessonAcademicResponseReady(response,q)});return}box.innerHTML=shuffle(q.options||[]).map(o=>\`<button class="question-option">\${o}</button>\`).join('');[...box.children].forEach(b=>b.onclick=()=>{if(s.checked)return;s.selected=b.textContent;[...box.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('#lessonActionBtn').disabled=false})}`;
            s=s.slice(0,showStart)+show+s.slice(showEnd);
            const checkStart=s.indexOf('async function checkLessonAnswer(){'),checkEnd=s.indexOf('async function finishLesson',checkStart);
            if(checkStart<0||checkEnd<0)throw new Error('checkLessonAnswer boundaries missing');
            const check=`async function checkLessonAnswer(){const s=lessonSession,q=s.questions[s.index],academic=window.POWDER_LEARNING_QUESTION_ENGINE_V2112;if(s.checked)return;const selected=s.getResponse?s.getResponse():s.selected;s.selected=selected;if(!lessonAcademicResponseReady(selected,q))return;const btn=$('#lessonActionBtn');btn.disabled=true;let ok=false,gradeResult=null;const SL=window.POWDER_SECURE_LEARNING_V176;try{if(SL?.hasAccount?.()){if(!s.secureSessionId)throw new Error('Phiên học chưa được server xác minh.');const r=await SL.answer(s.secureSessionId,q.id,String(selected??''),Math.max(0,Date.now()-(s.questionStartedAt||Date.now())));ok=!!r.correct;if(r.answer!=null)q.answer=String(r.answer);if(r.explanation!=null)q.explain=String(r.explanation)}else if(academic&&q.academicMeta){gradeResult=academic.grade(q,selected);ok=!!gradeResult.correct}else ok=selected===q.answer}catch(e){btn.disabled=false;toast(e?.message||'Không thể xác minh đáp án.');return}s.checked=true;if(ok)s.correct++;const generated=!!q.academicMeta?.generated;if(!generated){if(!ok)P.battleMistakes.push(q.id);E.recordQuestionResult(P,q,ok);if(!SL?.hasAccount?.())LM?.recordQuestionMastery?.(P,q,ok)}if(!SL?.hasAccount?.()&&academic&&q.academicMeta)academic.recordOutcome(P,q,ok);const selectedDisplay=academic&&q.academicMeta?academic.responseDisplay(q,selected):String(selected??'—'),answerDisplay=academic&&q.academicMeta?academic.answerDisplay(q):String(q.answer??'—');s.results=s.results||[];s.results.push({id:q.id,prompt:q.prompt,selected:selectedDisplay,answer:answerDisplay,explain:q.explain||'',ok});playFeedback(ok);const box=$('#lessonOptions');if(academic&&q.academicMeta)academic.mark(box,q,selected,gradeResult||{correct:ok});else[...box.children].forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct');else if(b.textContent===selected)b.classList.add('wrong');b.disabled=true});$('#lessonFeedback').innerHTML=\`<div class="feedback-answer \${ok?'is-correct':'is-wrong'}"><strong>\${ok?'✓ Chính xác':'✕ Chưa đúng'}</strong>\${ok?'':\`<span>Bạn trả lời: <b>\${selectedDisplay}</b></span>\`}<span>Đáp án đúng: <b>\${answerDisplay}</b></span></div>\${q.explain?\`<div class="feedback-explain"><b>Giải thích:</b> \${q.explain}</div>\`:''}<small>\${SL?.hasAccount?.()?'✓ Đáp án đã được server xác minh.':ok?'Kết quả đã được ghi vào Mastery học thuật.':generated?'Dimension yếu đã được ghi nhận để phiên sau ưu tiên cách hỏi phù hợp hơn.':'Concept này đã được đưa vào SRS; không lặp ngay cùng một câu.'}</small>\`;btn.textContent=s.index===s.questions.length-1?'Hoàn thành · xem toàn bộ đáp án':'Câu tiếp theo';btn.disabled=false;queueLessonSave();requestAnimationFrame(()=>$('#lessonFeedback')?.scrollIntoView?.({block:'nearest'}))}`;
            s=s.slice(0,checkStart)+check+s.slice(checkEnd);
            fs.writeFileSync(f,s);
          }
          // Bind the final regression gate to the new runtime without weakening any previous check.
          {
            const f='tools/powder-final-gate-v21004.mjs';
            let s=fs.readFileSync(f,'utf8');
            s=s.replace('manifest.length===1292','manifest.length===1294').replace('order.length===131','order.length===132');
            const idx="mobileIndex=order.indexOf('js/mobile-touch-runtime-v21014.js'),appIndex=order.indexOf('js/app.js')";
            if(s.includes(idx))s=s.replace(idx,"mobileIndex=order.indexOf('js/mobile-touch-runtime-v21014.js'),learningQuestionEngineIndex=order.indexOf('js/learning-question-engine-v2112.js'),appIndex=order.indexOf('js/app.js')");
            else if(!s.includes('learningQuestionEngineIndex'))throw new Error('final gate order anchor missing');
            const cond='interactionIndex===mobileIndex-1&&mobileIndex===appIndex-1&&playerJourneyIndex===appIndex+1';
            if(s.includes(cond))s=s.replace(cond,'interactionIndex===mobileIndex-1&&mobileIndex===learningQuestionEngineIndex-1&&learningQuestionEngineIndex===appIndex-1&&playerJourneyIndex===appIndex+1');
            else if(!s.includes('learningQuestionEngineIndex===appIndex-1'))throw new Error('final gate order condition missing');
            const src="combatWarmupSource=read('js/combat-warmup-v21019.js'),playerJourneySource=";
            if(s.includes(src))s=s.replace(src,"combatWarmupSource=read('js/combat-warmup-v21019.js'),learningQuestionEngineSource=read('js/learning-question-engine-v2112.js'),learningQuestionEngineCss=read('css/learning-question-engine-v2112.css'),playerJourneySource=");
            else if(!s.includes('learningQuestionEngineSource='))throw new Error('final gate source anchor missing');
            const marker="ok('playerJourneyIntegration'";
            const check="ok('learningQuestionEngineIntegration',learningQuestionEngineSource.includes(\"VERSION='21.1.2'\")&&learningQuestionEngineSource.includes('FAMILY_ORDER')&&learningQuestionEngineSource.includes('match_term_meaning')&&learningQuestionEngineSource.includes('multi_correct_pairs')&&learningQuestionEngineSource.includes('academicDimensionMastery')&&!learningQuestionEngineSource.includes('setInterval')&&!learningQuestionEngineSource.includes('MutationObserver')&&learningQuestionEngineCss.includes('.lqe-text-input')&&learningQuestionEngineCss.includes('.lqe-match-grid')&&appSource.includes('POWDER_LEARNING_QUESTION_ENGINE_V2112')&&appSource.includes('academic?.buildLessonPool?.(l,raw,P)')&&appSource.includes('academic.grade(q,selected)')&&manifest.some(x=>x.u==='js/learning-question-engine-v2112.js'&&x.k==='script')&&manifest.some(x=>x.u==='css/learning-question-engine-v2112.css'&&x.k==='style')&&boot.includes('powderLearningQuestionStyle2112')&&learningQuestionEngineIndex===appIndex-1,{learningQuestionEngineIndex,appIndex,cssInManifest:manifest.some(x=>x.u==='css/learning-question-engine-v2112.css')});\n";
            if(!s.includes("ok('learningQuestionEngineIntegration'")){const at=s.indexOf(marker);if(at<0)throw new Error('player journey gate marker missing');s=s.slice(0,at)+check+s.slice(at)}
            s=s.replace('powder-refresh-boot-manifest-v2111.mjs','powder-refresh-boot-manifest-v2112.mjs');
            fs.writeFileSync(f,s);
          }
          NODE
      - name: Refresh boot integrity
        run: node tools/powder-refresh-boot-manifest-v2112.mjs . --write
      - name: Verify final integration
        run: |
          node --check js/learning-question-engine-v2112.js
          node --check js/app.js
          node --check tools/powder-learning-question-engine-gate-v2112.mjs
          node --check tools/powder-refresh-boot-manifest-v2112.mjs
          node --check tools/powder-final-gate-v21004.mjs
          node tools/powder-refresh-boot-manifest-v2112.mjs .
          node tools/powder-final-gate-v21004.mjs .
      - name: Commit generated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/learning-question-engine-v2112.js js/app.js js/boot-loader-v21004.js tools/powder-final-gate-v21004.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: integrate learning question engine 21.1.2 [v2112-finalize]"
          git push origin HEAD:upgrade/21.1.2-learning-question-engine
