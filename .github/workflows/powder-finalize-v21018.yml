name: Powder 21.0.18 Finalize

on:
  push:
    branches:
      - upgrade/21.0.18-combat-skill-identity

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v21018-finalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/21.0.18-combat-skill-identity
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fix canonical reduced-motion gate
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='tools/powder-combat-skill-identity-gate-v21018.mjs';
          let s=fs.readFileSync(file,'utf8');
          const lines=s.split('\n');
          const reducedIndex=lines.findIndex(x=>x.includes('const reduced=await evaluate'));
          const checkIndex=lines.findIndex(x=>x.includes('report.details.reducedMotion=reduced'));
          const telemetryIndex=lines.findIndex(x=>x.includes('report.checks.telemetry=delta.stageCreates'));
          if(reducedIndex<0||checkIndex<0||telemetryIndex<0) throw new Error('21.0.18 gate anchors not found');
          lines[reducedIndex]="  const reduced=await evaluate(cmd,`(()=>{const api=window.POWDER_COMBAT_SKILL_IDENTITY_V21018,html=document.documentElement,prevReason=html.dataset.perfReason||'',m=document.getElementById('csi218Gate'),f=m.querySelector('.cv7-field');html.dataset.perfReason='reduced-motion';const before=api.snapshot().phaseBeats;m.dataset.tf217Phase='charge';m.querySelector('.cv7-attack-flow-layer')?.remove();m.querySelector('.cv7-attack-callout')?.remove();const c=document.createElement('div');c.className='cv7-attack-callout player';c.innerHTML='<div><b>Pyrion</b><span>Viêm Tinh</span></div>';f.appendChild(c);api.sync();const s=m.querySelector('.csi218-stage'),snap=api.snapshot(),result={key:m.dataset.csi218Key,tier:s?.querySelector('[data-csi218-tier]')?.textContent||'',display:s?getComputedStyle(s).display:'none',target:s?.querySelector('[data-csi218-target]')?.textContent||'',before,after:snap.phaseBeats,reasonActive:html.dataset.perfReason==='reduced-motion',reducedMotion:snap.reducedMotion===true};if(prevReason)html.dataset.perfReason=prevReason;else delete html.dataset.perfReason;return result})()`);";
          lines[checkIndex]="  report.details.reducedMotion=reduced;report.checks.reducedMotion=reduced.reasonActive&&reduced.reducedMotion&&reduced.key==='skill1'&&reduced.tier==='KỸ NĂNG I'&&reduced.target==='Frostmaw'&&reduced.display!=='none'&&reduced.after===reduced.before;";
          lines[telemetryIndex]=lines[telemetryIndex].replace('delta.inputHints>=6','delta.inputHints>=5');
          fs.writeFileSync(file,lines.join('\n'));
          NODE
      - name: Refresh boot integration
        run: node tools/powder-refresh-boot-manifest-v21018.mjs . --write
      - name: Commit final integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/powder-combat-skill-identity-gate-v21018.mjs js/boot-loader-v21004.js
          if git diff --cached --quiet; then
            echo "Final integration already current"
            exit 0
          fi
          git commit -m "fix: finalize 21.0.18 reduced motion and manifest [v21018-finalize]"
          git push origin HEAD:upgrade/21.0.18-combat-skill-identity
