name: Temporary Boot Fix 2 21.0.7

on:
  push:
    branches: [upgrade/21.0.7-browser-e2e]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'QuangThai2002'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/21.0.7-browser-e2e
      - name: Repair boot constants without breaking final-gate parser
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/boot-loader-v21004.js')
          text = p.read_text(encoding='utf-8')
          old = '\nconst TOTAL_BYTES=MANIFEST.reduce((sum,a)=>sum+(Number(a.s)||0),0);\nconst SCRIPT_ORDER='
          if old in text:
              text = text.replace(old, '\nconst SCRIPT_ORDER=', 1)
          anchor = '];\nconst TIPS='
          if 'const TOTAL_BYTES=' not in text:
              assert anchor in text, 'TIPS anchor not found after SCRIPT_ORDER'
              text = text.replace(anchor, '];\nconst TOTAL_BYTES=MANIFEST.reduce((sum,a)=>sum+(Number(a.s)||0),0);\nconst LEGACY=[];\nconst TIPS=', 1)
          elif 'const LEGACY=' not in text:
              text = text.replace('\nconst TIPS=', '\nconst LEGACY=[];\nconst TIPS=', 1)
          p.write_text(text, encoding='utf-8', newline='\n')
      - name: Verify compatibility and syntax
        run: |
          node --check js/boot-loader-v21004.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('js/boot-loader-v21004.js').read_text()
          assert '];\nconst SCRIPT_ORDER=' in s
          assert 'const TOTAL_BYTES=MANIFEST.reduce' in s
          assert 'const LEGACY=[];' in s
          print('boot constants and final-gate parser anchor OK')
          PY
      - name: Commit patch
        run: |
          git config user.name "Powder CI"
          git config user.email "actions@users.noreply.github.com"
          git add js/boot-loader-v21004.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "21.0.7: repair boot constants and gate compatibility"
          git push origin HEAD:upgrade/21.0.7-browser-e2e
