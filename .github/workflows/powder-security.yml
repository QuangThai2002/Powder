name: Powder Supply Chain Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: powder-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Supply-chain and secret policy
        run: node tools/powder-supply-chain-gate-v21006.mjs . | tee SUPPLY-CHAIN-GATE.json
      - name: Current Powder regression
        run: node tools/powder-final-gate-v21004.mjs . > SECURITY-FINAL-GATE.json
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powder-security-${{ github.sha }}
          path: |
            SUPPLY-CHAIN-GATE.json
            SECURITY-FINAL-GATE.json
          if-no-files-found: error
          retention-days: 30
