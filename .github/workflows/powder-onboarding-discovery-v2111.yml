name: Powder Onboarding Discovery

on:
  pull_request:
    branches: [main]
  push:
    branches: [upgrade/21.1.1-onboarding-discovery]

permissions:
  contents: read

concurrency:
  group: powder-onboarding-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Chrome
        run: google-chrome --version
      - name: Verify 21.1.1 source
        run: |
          node --check js/onboarding-v146.js
          node --check tools/powder-onboarding-discovery-gate-v2111.mjs
          node --check tools/powder-refresh-boot-manifest-v2111.mjs
          node tools/powder-refresh-boot-manifest-v2111.mjs .
      - name: Run onboarding discovery gate
        run: node tools/powder-onboarding-discovery-gate-v2111.mjs .
      - name: Upload onboarding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powder-onboarding-discovery-${{ github.sha }}
          path: artifacts/onboarding-discovery-v2111/
          if-no-files-found: warn
          retention-days: 14
