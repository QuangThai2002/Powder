name: Temporary Visual Baseline 21.0.8

on:
  push:
    branches: [upgrade/21.0.8-visual-performance-gate]

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor == 'QuangThai2002'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/21.0.8-visual-performance-gate
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate approved 21.0.8 baseline from 21.0.7 runtime
        run: node tools/powder-visual-performance-gate-v21008.mjs . --update-baseline
      - name: Commit baseline JSON
        run: |
          git config user.name "Powder CI"
          git config user.email "actions@users.noreply.github.com"
          git add tests/visual-baseline/v21008/baseline.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "21.0.8: lock visual and performance baseline"
          git push origin HEAD:upgrade/21.0.8-visual-performance-gate
