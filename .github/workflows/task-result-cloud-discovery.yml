name: Result Cloud Lifecycle Fix

on:
  push:
    branches:
      - work/adventure-combat-entry-user-test-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify base ancestry and clean checkout
        run: |
          git merge-base --is-ancestor 2d1fb6fd89a3204a0cf212832b5a286cb90b201f HEAD
          test -z "$(git status --short)"

      - name: Repair executor authority call scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/task-result-cloud-lifecycle-executor.py')
          s=p.read_text()
          old="s = replace_once(s, \"const authorityMode=runtimePveAuthorityMode(options?.authorityMode);\", \"const authorityMode=runtimePveAuthorityMode(options?.authorityMode,stage);\", 'entry authority call')"
          new="old_call=\"const authorityMode=runtimePveAuthorityMode(options?.authorityMode);\"\nnew_call=\"const authorityMode=runtimePveAuthorityMode(options?.authorityMode,stage);\"\nidx=s.find(old_call)\nif idx<0: raise SystemExit('entry authority call: anchor missing')\ns=s[:idx]+s[idx:].replace(old_call,new_call,1)"
          if s.count(old)!=1: raise SystemExit(f'executor repair anchor count {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Apply Result and Cloud lifecycle fix
        run: python tools/task-result-cloud-lifecycle-executor.py

      - name: Align PVE regression with explicit authority policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/verify-combat2-pve-handoff.mjs')
          s=p.read_text()

          old_academic="      applyCombatAcademicOutcome: (entry) => { learning.push(entry); return window.POWDER_SECURE_ECONOMY_V152?.hasAccount?.() ? { ok: false, serverProtected: true } : { ok: true, applied: { responses: entry.responses.length } }; },"
          new_academic="      applyCombatAcademicOutcome: (entry) => { learning.push(entry); return { ok: true, applied: { responses: entry.responses.length } }; },"
          if s.count(old_academic)!=1: raise SystemExit(f'academic fixture anchor count {s.count(old_academic)}')
          s=s.replace(old_academic,new_academic,1)

          old_reward="      grantBattleRewards: (entry) => { rewards.push(entry); if(window.POWDER_SECURE_ECONOMY_V152?.hasAccount?.())return { ok: false, serverProtected: true, rewardLocked: true };saveState.coins+=entry.coins;saveState.exp+=entry.exp;saveState.wins+=entry.wins;return { ok: true, coins: saveState.coins, exp: saveState.exp, wins: saveState.wins }; },"
          new_reward="      grantBattleRewards: (entry) => { rewards.push(entry); saveState.coins+=entry.coins;saveState.exp+=entry.exp;saveState.wins+=entry.wins;return { ok: true, coins: saveState.coins, exp: saveState.exp, wins: saveState.wins }; },"
          if s.count(old_reward)!=1: raise SystemExit(f'reward fixture anchor count {s.count(old_reward)}')
          s=s.replace(old_reward,new_reward,1)

          old_case1="""  runtime.window.POWDER_SECURE_ECONOMY_V152 = { hasAccount: () => true };\n  const onlineBlocked = await handoff.settleReturnedResult();\n  assert.equal(onlineBlocked.ok, false, 'Online reward without server authority must not settle');\n  assert.equal(onlineBlocked.reason, 'online-reward-authority-unavailable');\n  assert.equal(runtime.learning.length, 0, 'Online academic result must not be locally settled');\n  assert.equal(runtime.rewards.length, 0, 'Online protected reward must not be journaled as success');\n  assert.equal(handoff.readBattleResult().ok, true, 'failed Online settlement must keep BattleResult');\n  runtime.window.POWDER_SECURE_ECONOMY_V152 = { hasAccount: () => false };\n  const settled = await handoff.settleReturnedResult();\n"""
          new_case1="""  runtime.window.POWDER_SECURE_ECONOMY_V152 = { hasAccount: () => true };\n  assert.equal(request.value.sourceContext.authorityMode, 'offline', 'logged-in normal Adventure PVE must remain offline authority without explicit server proof');\n  const settled = await handoff.settleReturnedResult();\n  assert.equal(settled.ok, true, 'Login/account presence alone must not classify normal Adventure PVE as server-authoritative');\n"""
          if s.count(old_case1)!=1: raise SystemExit(f'PVE case1 anchor count {s.count(old_case1)}')
          s=s.replace(old_case1,new_case1,1)

          duplicate_anchor="""  assert.equal(handoff.readBattleRequest().ok, false, 'duplicate result must still be consumed');\n  assert.equal(handoff.readBattleResult().ok, false, 'duplicate result must still be consumed');\n\n"""
          server_case="""  assert.equal(handoff.readBattleRequest().ok, false, 'duplicate result must still be consumed');\n  assert.equal(handoff.readBattleResult().ok, false, 'duplicate result must still be consumed');\n\n  const serverMutationCounts = {\n    learning: runtime.learning.length,\n    rewards: runtime.rewards.length,\n    progression: runtime.adventureResults.length\n  };\n  const verifiedServerStage = { ...stage(), serverCombatSessionId: 'server-pve-test-1' };\n  const serverRequest = entry.createPvePilotRequest(verifiedServerStage, {\n    authorityMode: 'server',\n    createdAt: request.value.createdAt + 1000\n  });\n  assert.equal(serverRequest.ok, true, 'verified server PVE fixture must create a BattleRequest');\n  assert.equal(serverRequest.value.sourceContext.authorityMode, 'server', 'explicit verified server proof must classify PVE as server authority');\n  assert.equal(serverRequest.value.sourceContext.stage.serverCombatSessionId, 'server-pve-test-1');\n  assert.equal(handoff.storeBattleRequest(serverRequest.value).ok, true);\n  const serverQuestions = contract.academicQuestionsFromContext(serverRequest.value.academicContext);\n  assert.ok(serverQuestions.length > 0, 'verified server fixture needs an academic response to prove local academic authority stays untouched');\n  const serverResult = contract.createCombat2BattleResult(serverRequest.value, {\n    result: 'victory',\n    survivingState: { player: [{ id: 'hero-1', hp: 100 }], enemy: [], round: 2 },\n    academicResponses: [{ question: serverQuestions[0], correct: true, powId: 'hero-1' }]\n  });\n  assert.equal(handoff.publishBattleResult(serverResult).ok, true);\n  const serverBlocked = await handoff.settleReturnedResult();\n  assert.equal(serverBlocked.ok, false, 'verified server PVE must fail closed until real server settlement exists');\n  assert.equal(serverBlocked.reason, 'online-reward-authority-unavailable');\n  assert.equal(runtime.learning.length, serverMutationCounts.learning, 'verified server PVE must not run local academic authority');\n  assert.equal(runtime.rewards.length, serverMutationCounts.rewards, 'verified server PVE must not run local reward authority');\n  assert.equal(runtime.adventureResults.length, serverMutationCounts.progression, 'verified server PVE must not run local Adventure progression');\n  assert.equal(handoff.readBattleResult().ok, true, 'blocked verified server result must remain recoverable');\n\n"""
          if s.count(duplicate_anchor)!=1: raise SystemExit(f'PVE case2 insertion anchor count {s.count(duplicate_anchor)}')
          s=s.replace(duplicate_anchor,server_case,1)
          p.write_text(s)
          PY

      - name: Refresh canonical boot manifest
        run: node tools/refresh-canonical-reconciliation-boot.mjs

      - name: Verify implementation scope and syntax
        run: |
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          expected=$'js/boot-loader-v21004.js\njs/combat-entry-v177.js\njs/combat-result-controller-v1.js\njs/online-foundation-v150.js\ntools/task-result-cloud-lifecycle-executor.py\ntools/verify-combat-result-cloud-lifecycle-v1.mjs\ntools/verify-combat-result-final-flow-v1.mjs\ntools/verify-combat2-pve-handoff.mjs'
          printf 'Implementation scope:\n%s\n' "$actual"
          test "$actual" = "$expected"
          node --check js/combat-entry-v177.js
          node --check js/combat-result-controller-v1.js
          node --check js/online-foundation-v150.js
          node --check tools/verify-combat-result-final-flow-v1.mjs
          node --check tools/verify-combat-result-cloud-lifecycle-v1.mjs
          node --check tools/verify-combat2-pve-handoff.mjs
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Player State authority
        run: node tools/verify-player-state-authority-v1.mjs

      - name: Combat Academic authority
        run: node tools/verify-combat-academic-authority-v1.mjs

      - name: Adventure Progression authority
        run: node tools/verify-adventure-progression-authority-v1.mjs

      - name: Final Result lifecycle
        run: node tools/verify-combat-result-final-flow-v1.mjs

      - name: Cloud canonical lifecycle
        run: node tools/verify-combat-result-cloud-lifecycle-v1.mjs

      - name: PVE handoff regression
        run: node tools/verify-combat2-pve-handoff.mjs

      - name: Player readiness regression
        run: node tools/verify-player-test-readiness.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Static ownership audit
        run: |
          git diff --check
          ! grep -Fq 'function nextReadiness' js/combat-result-controller-v1.js
          ! grep -Eq 'runtimePveAuthorityMode[^\n]*(hasSession|hasAccount)' js/combat-entry-v177.js
          grep -Fq 'function verifiedPveServerAuthority' js/combat-entry-v177.js
          grep -Fq 'serverCombatSessionId' js/combat-entry-v177.js
          grep -Fq "authorityMode,stage" js/combat-entry-v177.js
          grep -Fq 'online-reward-authority-unavailable' js/combat-entry-v177.js
          grep -Fq 'acknowledged:false,acknowledgedAt:null' js/combat-result-controller-v1.js
          grep -Fq 'acknowledged:true,acknowledgedAt:Date.now()' js/combat-result-controller-v1.js
          grep -Fq "finalReceipt.acknowledged===true" js/combat-entry-v177.js
          grep -Fq "pendingAcknowledgement:true" js/combat-entry-v177.js
          grep -Fq "PENDING_SYNC_KEY='powder_online_pending_sync_v150'" js/online-foundation-v150.js
          grep -Fq 'function canonicalGameplayState' js/online-foundation-v150.js
          hydrate="$(sed -n '/async function hydrate()/,/function schedule(/p' js/online-foundation-v150.js)"
          ! grep -Fq 'showConflict(' <<< "$hydrate"
          ! grep -Fq 'function keepLocal(' js/online-foundation-v150.js
          grep -Fq 'function recoverUseLocal' js/online-foundation-v150.js
          grep -Fq 'function recoverUseCloud' js/online-foundation-v150.js

      - name: Commit validated fix
        run: |
          git config user.name "QuangThai2002"
          git config user.email "134858800+QuangThai2002@users.noreply.github.com"
          git checkout -- tools/task-result-cloud-lifecycle-executor.py
          git rm .github/workflows/task-result-cloud-discovery.yml tools/task-result-cloud-lifecycle-executor.py
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          expected=$'.github/workflows/task-result-cloud-discovery.yml\njs/boot-loader-v21004.js\njs/combat-entry-v177.js\njs/combat-result-controller-v1.js\njs/online-foundation-v150.js\ntools/task-result-cloud-lifecycle-executor.py\ntools/verify-combat-result-cloud-lifecycle-v1.mjs\ntools/verify-combat-result-final-flow-v1.mjs\ntools/verify-combat2-pve-handoff.mjs'
          printf 'Final commit scope:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git add -A
          git diff --cached --check
          git commit -m "fix(result): simplify pve confirmation and cloud lifecycle"
          git push origin HEAD:work/adventure-combat-entry-user-test-v1
