name: Result Cloud Lifecycle Fix

on:
  push:
    branches:
      - work/adventure-combat-entry-user-test-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify base ancestry and clean checkout
        run: |
          git merge-base --is-ancestor 2d1fb6fd89a3204a0cf212832b5a286cb90b201f HEAD
          test -z "$(git status --short)"

      - name: Apply Result and Cloud lifecycle fix
        run: python tools/task-result-cloud-lifecycle-executor.py

      - name: Refresh canonical boot manifest
        run: node tools/refresh-canonical-reconciliation-boot.mjs

      - name: Verify implementation scope and syntax
        run: |
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          expected=$'js/boot-loader-v21004.js\njs/combat-entry-v177.js\njs/combat-result-controller-v1.js\njs/online-foundation-v150.js\ntools/verify-combat-result-cloud-lifecycle-v1.mjs\ntools/verify-combat-result-final-flow-v1.mjs'
          printf 'Implementation scope:\n%s\n' "$actual"
          test "$actual" = "$expected"
          node --check js/combat-entry-v177.js
          node --check js/combat-result-controller-v1.js
          node --check js/online-foundation-v150.js
          node --check tools/verify-combat-result-final-flow-v1.mjs
          node --check tools/verify-combat-result-cloud-lifecycle-v1.mjs
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Player State authority
        run: node tools/verify-player-state-authority-v1.mjs

      - name: Combat Academic authority
        run: node tools/verify-combat-academic-authority-v1.mjs

      - name: Adventure Progression authority
        run: node tools/verify-adventure-progression-authority-v1.mjs

      - name: Final Result lifecycle
        run: node tools/verify-combat-result-final-flow-v1.mjs

      - name: Cloud canonical lifecycle
        run: node tools/verify-combat-result-cloud-lifecycle-v1.mjs

      - name: PVE handoff regression
        run: node tools/verify-combat2-pve-handoff.mjs

      - name: Player readiness regression
        run: node tools/verify-player-test-readiness.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Static ownership audit
        run: |
          git diff --check
          ! grep -Fq 'function nextReadiness' js/combat-result-controller-v1.js
          ! grep -Eq 'runtimePveAuthorityMode[^\n]*(hasSession|hasAccount)' js/combat-entry-v177.js
          grep -Fq 'acknowledged:false,acknowledgedAt:null' js/combat-result-controller-v1.js
          grep -Fq 'acknowledged:true,acknowledgedAt:Date.now()' js/combat-result-controller-v1.js
          grep -Fq "finalReceipt.acknowledged===true" js/combat-entry-v177.js
          grep -Fq "pendingAcknowledgement:true" js/combat-entry-v177.js
          grep -Fq "PENDING_SYNC_KEY='powder_online_pending_sync_v150'" js/online-foundation-v150.js
          grep -Fq 'function canonicalGameplayState' js/online-foundation-v150.js
          hydrate="$(sed -n '/async function hydrate()/,/function schedule(/p' js/online-foundation-v150.js)"
          ! grep -Fq 'showConflict(' <<< "$hydrate"
          ! grep -Fq 'function keepLocal(' js/online-foundation-v150.js
          grep -Fq 'function recoverUseLocal' js/online-foundation-v150.js
          grep -Fq 'function recoverUseCloud' js/online-foundation-v150.js

      - name: Commit validated fix
        run: |
          git config user.name "QuangThai2002"
          git config user.email "134858800+QuangThai2002@users.noreply.github.com"
          git rm .github/workflows/task-result-cloud-discovery.yml tools/task-result-cloud-lifecycle-executor.py
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          expected=$'.github/workflows/task-result-cloud-discovery.yml\njs/boot-loader-v21004.js\njs/combat-entry-v177.js\njs/combat-result-controller-v1.js\njs/online-foundation-v150.js\ntools/task-result-cloud-lifecycle-executor.py\ntools/verify-combat-result-cloud-lifecycle-v1.mjs\ntools/verify-combat-result-final-flow-v1.mjs'
          printf 'Final commit scope:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git add -A
          git diff --cached --check
          git commit -m "fix(result): simplify pve confirmation and cloud lifecycle"
          git push origin HEAD:work/adventure-combat-entry-user-test-v1
