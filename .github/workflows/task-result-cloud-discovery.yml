name: Result Cloud Discovery

on:
  push:
    branches:
      - work/adventure-combat-entry-user-test-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify expected base ancestry
        run: git merge-base --is-ancestor 2d1fb6fd89a3204a0cf212832b5a286cb90b201f HEAD
      - name: Discover cloud runtime and history
        shell: bash
        run: |
          echo '=== CANDIDATE FILES ==='
          find js tools -type f | sort | grep -Ei '(online|cloud|sync|account|auth|save)' || true
          echo '=== SYMBOL LOCATIONS ==='
          grep -RInE 'POWDER_ONLINE_V150|showConflict|keepLocal|fingerprint\(|lastSavedAt|Chọn tiến độ muốn tiếp tục|hydrate\(|cloud.{0,30}save|save.{0,30}cloud' js index.html tools --exclude-dir=node_modules | head -n 500 || true
          echo '=== CLOUD HISTORY ==='
          git log --all --date=iso --pretty=format:'%H%x09%ad%x09%s' --regexp-ignore-case --grep='cloud' --grep='online-v150' --grep='sync conflict' --grep='save reconciliation' -n 120
          echo
          echo '=== HISTORY FILES ==='
          for sha in $(git log --all --pretty=format:'%H' --regexp-ignore-case --grep='cloud' --grep='online-v150' --grep='sync conflict' --grep='save reconciliation' -n 20); do
            echo "--- $sha ---"
            git show --name-only --format='%H %s' "$sha" | sed '/^$/d' | head -n 80
          done
          echo '=== END DISCOVERY ==='
