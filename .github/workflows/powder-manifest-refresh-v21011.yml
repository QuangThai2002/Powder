name: Powder 21.0.11 Manifest Refresh

on:
  push:
    branches:
      - upgrade/21.0.11-adaptive-runtime-pressure-governor

permissions:
  contents: write

jobs:
  refresh-manifest:
    if: ${{ !contains(github.event.head_commit.message, '[manifest-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/21.0.11-adaptive-runtime-pressure-governor
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh integrity manifest
        run: node tools/powder-refresh-boot-manifest-v21011.mjs . --write
      - name: Commit refreshed boot manifest
        shell: bash
        run: |
          if git diff --quiet -- js/boot-loader-v21004.js; then
            echo "Manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/boot-loader-v21004.js
          git commit -m "build: refresh 21.0.11 boot integrity [manifest-refresh]"
          git push origin HEAD:upgrade/21.0.11-adaptive-runtime-pressure-governor
