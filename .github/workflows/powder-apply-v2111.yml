name: Powder 21.1.1 Apply

on:
  push:
    branches: [upgrade/21.1.1-onboarding-discovery]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v2111-apply]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/21.1.1-onboarding-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply onboarding quick/full mode
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='js/onboarding-v146.js';
          let s=fs.readFileSync(file,'utf8');
          const patch=(old,next,label)=>{if(s.includes(old))s=s.replace(old,next);else if(!s.includes(next))throw new Error('Missing '+label)};
          patch("const KEY='powder_onboarding_v146',VERSION='17.8.1';","const KEY='powder_onboarding_v146',VERSION='21.1.1';",'version');
          patch("target:'#playerJourneyHubV147'","target:'#powderJourney2110, #playerJourneyHubV147'",'journey target');
          patch("  const showView=name=>{try{window.POWDER_APP?.showView?.(name)}catch(_){}};","  const FULL_STEPS=steps.slice(),QUICK_STEP_INDEXES=[0,1,3,8,14],QUICK_STEPS=QUICK_STEP_INDEXES.map(i=>FULL_STEPS[i]);let quickMode=false;\n  const applyMode=mode=>{quickMode=mode==='quick';const source=quickMode?QUICK_STEPS:FULL_STEPS;steps.splice(0,steps.length,...source)};\n  const showView=name=>{try{window.POWDER_APP?.showView?.(name)}catch(_){}};",'mode helpers');
          patch("  function start(from=0){autoTimer=clearTimer(autoTimer);index=Math.max(0,Math.min(steps.length-1,Number(from)||0));","  function start(from=0,mode='full'){autoTimer=clearTimer(autoTimer);applyMode(mode);index=Math.max(0,Math.min(steps.length-1,Number(from)||0));",'start mode');
          patch("autoTimer=setTimeout(()=>{autoTimer=0;if(!running&&!state().seen)start(0)},650)","autoTimer=setTimeout(()=>{autoTimer=0;if(!running&&!state().seen)start(0,'quick')},650)",'auto quick');
          patch("steps:()=>steps.map(x=>({title:x.title,view:x.view}))","steps:()=>FULL_STEPS.map(x=>({title:x.title,view:x.view})),flowSteps:()=>steps.map(x=>({title:x.title,view:x.view})),mode:()=>quickMode?'quick':'full'",'diagnostics api');
          fs.writeFileSync(file,s);
          NODE
      - name: Bind final gate and integrity
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const f='tools/powder-final-gate-v21004.mjs';
          let s=fs.readFileSync(f,'utf8');
          const old="const refresh=spawnSync(process.execPath,[path.join(root,'tools/powder-refresh-boot-manifest-v2110.mjs'),root],{encoding:'utf8'});";
          const check="const onboarding2111Source=read('js/onboarding-v146.js');\nok('onboarding2111Integration',onboarding2111Source.includes(\"VERSION='21.1.1'\")&&onboarding2111Source.includes('QUICK_STEP_INDEXES=[0,1,3,8,14]')&&onboarding2111Source.includes(\"start(0,'quick')\")&&onboarding2111Source.includes('#powderJourney2110, #playerJourneyHubV147')&&onboarding2111Source.includes('flowSteps:()=>steps.map')&&onboarding2111Source.includes(\"mode:()=>quickMode?'quick':'full'\")&&manifest.some(x=>x.u==='js/onboarding-v146.js'&&x.k==='script'),{});\nconst refresh=spawnSync(process.execPath,[path.join(root,'tools/powder-refresh-boot-manifest-v2111.mjs'),root],{encoding:'utf8'});";
          if(s.includes(old))s=s.replace(old,check);else if(!s.includes('onboarding2111Integration'))throw new Error('21.1.1 final gate anchor missing');
          fs.writeFileSync(f,s);
          NODE
          node tools/powder-refresh-boot-manifest-v2111.mjs . --write
      - name: Verify patch
        run: |
          node --check js/onboarding-v146.js
          node --check tools/powder-onboarding-discovery-gate-v2111.mjs
          node --check tools/powder-refresh-boot-manifest-v2111.mjs
          node --check tools/powder-final-gate-v21004.mjs
          node tools/powder-refresh-boot-manifest-v2111.mjs .
          node tools/powder-final-gate-v21004.mjs .
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/onboarding-v146.js js/boot-loader-v21004.js tools/powder-final-gate-v21004.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: apply 21.1.1 quick onboarding discovery [v2111-apply]"
          git push origin HEAD:upgrade/21.1.1-onboarding-discovery
