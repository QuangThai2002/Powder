name: Powder 21.0.20 Gate Finalize

on:
  push:
    branches:
      - upgrade/21.0.20-player-experience-final-audit

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v21020-gate-finalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/21.0.20-player-experience-final-audit
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stabilize final player-flow audit
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const f='tools/powder-player-experience-final-gate-v21020.mjs';
          let s=fs.readFileSync(f,'utf8');
          const lines=s.split('\n');
          if(!s.includes('async function waitExactView')){
            const i=lines.findIndex(x=>x.startsWith('async function viewState'));
            if(i<0)throw new Error('viewState anchor missing');
            lines.splice(i+1,0,"async function waitExactView(cmd,view,t=6000,stableMs=240){const started=Date.now();let stableFrom=0,last=null;while(Date.now()-started<t){last=await viewState(cmd,view);const exact=last.active===view&&last.visible.length===1&&last.visible[0]===view&&!last.scene?.firstPaintPending;if(exact){if(!stableFrom)stableFrom=Date.now();if(Date.now()-stableFrom>=stableMs)return last}else stableFrom=0;await sleep(60)}return last}");
          }
          s=lines.join('\n');
          s=s.replace("const starter=await enterStarter(cmd);report.checks.firstRunStarter=starter===true;if(!starter)throw new Error('Starter first-run flow failed');await sleep(250);const home0=await viewState(cmd,'after-starter');", "const starter=await enterStarter(cmd);report.checks.firstRunStarter=starter===true;if(!starter)throw new Error('Starter first-run flow failed');await sleep(650);await waitSettled(cmd);const home0=await waitExactView(cmd,'home',6000,500);");
          s=s.replace("const route=['home','inventory','learn','adventure','chests','powdex','settings','home'],nav=[];for(const v of route){await ev(cmd,`window.POWDER_APP.showView(${JSON.stringify(v)})`);await sleep(130);nav.push(await viewState(cmd,v))}", "const route=['home','inventory','learn','adventure','chests','powdex','settings','home'],nav=[];for(const v of route){await ev(cmd,`window.POWDER_APP.showView(${JSON.stringify(v)})`);nav.push(await waitExactView(cmd,v,6000,240))}");
          s=s.replace("small:targets.filter(x=>x.w<40||x.h<40).slice(0,12),mobile:", "small:targets.filter(x=>x.w<40||x.h<40).slice(0,12),powdexBackH:(()=>{const e=document.querySelector('.powdex-back1793');return e?Math.round(e.getBoundingClientRect().height):0})(),mobile:");
          s=s.replace("report.checks.mobileTapTargets=mobile.every(x=>x.targetCount>=4&&x.small.length===0&&x.minW>=40&&x.minH>=40);const mobileFinal=mobile[mobile.length-1];", "report.checks.mobileTapTargets=mobile.every(x=>x.targetCount>=4&&x.small.length===0&&x.minW>=40&&x.minH>=40);report.checks.powdexBackTapTarget=Number(mobile.find(x=>x.label==='powdex')?.powdexBackH||0)>=44;const mobileFinal=mobile[mobile.length-1];");
          if(!s.includes('waitExactView(cmd,v,6000,240)')||!s.includes('powdexBackTapTarget'))throw new Error('21.0.20 audit patch did not bind');
          fs.writeFileSync(f,s);
          NODE
      - name: Verify audit syntax
        run: node --check tools/powder-player-experience-final-gate-v21020.mjs
      - name: Commit final audit gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/powder-player-experience-final-gate-v21020.mjs
          if git diff --cached --quiet; then
            echo "21.0.20 player-flow gate already finalized"
            exit 0
          fi
          git commit -m "test: stabilize 21.0.20 exact-view audit [v21020-gate-finalize]"
          git push origin HEAD:upgrade/21.0.20-player-experience-final-audit
