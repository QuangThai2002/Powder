name: Powder 21.1.4 Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'upgrade/21.1.4-mastery-adaptive-review' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/21.1.4-mastery-adaptive-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch integration
        run: |
          node tools/powder-fix-learned-pool-v2114.mjs
          node tools/powder-finalize-v2114.mjs
      - name: Refresh boot integrity
        run: node tools/powder-refresh-boot-manifest-v2114.mjs . --write
      - name: Verify all learning compatibility gates
        run: |
          node --check js/learning-mastery-adaptive-v2114.js
          node --check js/app.js
          node --check tools/powder-mastery-adaptive-gate-v2114.mjs
          node --check tools/powder-refresh-boot-manifest-v2114.mjs
          node --check tools/powder-final-gate-v21004.mjs
          node tools/powder-refresh-boot-manifest-v2110.mjs .
          node tools/powder-refresh-boot-manifest-v2111.mjs .
          node tools/powder-refresh-boot-manifest-v2112.mjs .
          node tools/powder-refresh-boot-manifest-v2113.mjs .
          node tools/powder-refresh-boot-manifest-v2114.mjs .
          node tools/powder-mastery-adaptive-gate-v2114.mjs .
          node tools/powder-academic-content-gate-v2113.mjs .
          node tools/powder-learning-question-engine-gate-v2112.mjs .
          node tools/powder-final-gate-v21004.mjs .
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/learning-mastery-adaptive-v2114.js js/app.js js/boot-loader-v21004.js tools/powder-final-gate-v21004.mjs tools/powder-refresh-boot-manifest-v2110.mjs tools/powder-refresh-boot-manifest-v2111.mjs tools/powder-refresh-boot-manifest-v2112.mjs tools/powder-refresh-boot-manifest-v2113.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: integrate mastery adaptive 21.1.4 [v2114-finalize]"
          git push origin HEAD:upgrade/21.1.4-mastery-adaptive-review
