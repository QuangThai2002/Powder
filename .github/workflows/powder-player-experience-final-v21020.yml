name: Powder Player Experience Final Audit

on:
  push:
    branches:
      - main
      - upgrade/21.0.20-player-experience-final-audit
  pull_request:

permissions:
  contents: read

jobs:
  player-experience-final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Chrome
        run: google-chrome --version
      - name: Run player experience final audit
        run: node tools/powder-player-experience-final-gate-v21020.mjs .
      - name: Upload player experience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powder-player-experience-final-${{ github.sha }}
          path: artifacts/player-experience-v21020/
          if-no-files-found: warn
          retention-days: 14
