name: Powder Daily Boss Intelligence 21.2.1

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/learning-daily-boss-intelligence-v2121.js'
      - 'js/learning-srs-intelligence-v2114.js'
      - 'tools/powder-daily-boss-intelligence-gate-v2121.mjs'
      - '.github/workflows/powder-daily-boss-intelligence-v2121.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powder-daily-boss-intelligence-v2121-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Syntax guard
        run: |
          node --check js/learning-daily-boss-intelligence-v2121.js
          node --check tools/powder-daily-boss-intelligence-gate-v2121.mjs
      - name: Critical path isolation
        run: git diff --exit-code origin/main...HEAD -- index.html js/boot-loader-v21004.js js/app.js
      - name: Daily Boss Intelligence regression
        run: node tools/powder-daily-boss-intelligence-gate-v2121.mjs .
      - name: Learning Command Center regression
        run: node tools/powder-learning-command-center-gate-v2120.mjs .
      - name: Daily rotation regression
        run: node tools/powder-daily-rotation-runner-gate-v2119.mjs .
      - name: Explanation coverage regression
        run: node tools/powder-explanation-coverage-gate-v2118.mjs .
      - name: Adaptive question mix regression
        run: node tools/powder-adaptive-question-mix-gate-v2117.mjs .
      - name: Mastery recovery regression
        run: node tools/powder-mastery-recovery-gate-v2116.mjs .
      - name: Daily study regression
        run: node tools/powder-daily-study-orchestrator-gate-v2115.mjs .
      - name: SRS regression
        run: node tools/powder-srs-intelligence-gate-v2114.mjs .
      - name: Final regression gate
        run: node tools/powder-final-gate-v21004.mjs .
