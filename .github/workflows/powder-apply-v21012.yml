name: Powder 21.0.12 Integration Apply

on:
  push:
    branches:
      - upgrade/21.0.12-scene-transition-asset-residency

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v21012-integration]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/21.0.12-scene-transition-asset-residency
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply scene integration
        run: node tools/powder-apply-scene-transition-v21012.mjs .
      - name: Refresh boot manifest
        run: node tools/powder-refresh-boot-manifest-v21012.mjs . --write
      - name: Commit generated integration
        shell: bash
        run: |
          if git diff --quiet -- js/app.js js/boot-loader-v21004.js; then
            echo "Integration already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/boot-loader-v21004.js
          git commit -m "build: integrate 21.0.12 scheduler [v21012-integration]"
          git push origin HEAD:upgrade/21.0.12-scene-transition-asset-residency
