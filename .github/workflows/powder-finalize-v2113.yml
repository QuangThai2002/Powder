name: Powder 21.1.3 Finalize

on:
  push:
    branches: [upgrade/21.1.3-academic-content-expansion]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[v2113-finalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/21.1.3-academic-content-expansion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch integration
        run: node tools/powder-finalize-v2113.mjs
      - name: Refresh boot integrity
        run: node tools/powder-refresh-boot-manifest-v2113.mjs . --write
      - name: Verify final integration
        run: |
          node --check js/learning-academic-content-v2113.js
          node --check js/learning-question-engine-v2112.js
          node --check tools/powder-academic-content-gate-v2113.mjs
          node --check tools/powder-refresh-boot-manifest-v2113.mjs
          node --check tools/powder-final-gate-v21004.mjs
          node tools/powder-refresh-boot-manifest-v2113.mjs .
          node tools/powder-academic-content-gate-v2113.mjs .
          node tools/powder-final-gate-v21004.mjs .
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/learning-question-engine-v2112.js js/boot-loader-v21004.js tools/powder-final-gate-v21004.mjs tools/powder-refresh-boot-manifest-v2110.mjs tools/powder-refresh-boot-manifest-v2111.mjs tools/powder-refresh-boot-manifest-v2112.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: integrate academic content 21.1.3 [v2113-finalize]"
          git push origin HEAD:upgrade/21.1.3-academic-content-expansion
