name: Powder 21.1.3 Finalize

on:
  push:
    branches: [upgrade/21.1.3-academic-content-expansion]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v2113-finalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/21.1.3-academic-content-expansion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Integrate Academic Content 21.1.3
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          // Hook 21.1.3 into the 21.1.2 engine without changing app/server contracts.
          {
            const f='js/learning-question-engine-v2112.js';let s=fs.readFileSync(f,'utf8');
            const buildRe=/function buildLessonPool\(lesson,baseQuestions=\[\],save=null\)\{[\s\S]*?\}\nfunction dimensionScore/;
            const build=`function buildLessonPool(lesson,baseQuestions=[],save=null){if(!lesson)return[];const out=(baseQuestions||[]).filter(Boolean).map(q=>canonicalQuestion(lesson,q));addVocabQuestions(out,lesson);addPatternQuestions(out,lesson);addDialogueQuestions(out,lesson);addCanonicalTransforms(out,lesson,baseQuestions);const seen=new Set,base=out.filter(q=>{const k=String(q.id||'');if(!k||seen.has(k))return false;seen.add(k);return q.academicMeta?.sourceLessonId===String(lesson.id)}),academic=window.POWDER_ACADEMIC_CONTENT_V2113;return academic?.augmentPool?.(lesson,base,save)||base}\nfunction dimensionScore`;
            if(!s.includes('POWDER_ACADEMIC_CONTENT_V2113')){if(!buildRe.test(s))throw new Error('buildLessonPool anchor missing');s=s.replace(buildRe,build)}
            const selectRe=/function selectSessionQuestions\(save,lesson,pool,\{min=30,max=40\}=\{\}\)\{[\s\S]*?\}\nfunction grade/;
            if(!s.includes('academic?.planSession?.(save,lesson')){
              const m=s.match(selectRe);if(!m)throw new Error('selectSessionQuestions anchor missing');
              const legacy=m[0].slice(0,-'\nfunction grade'.length);
              const body=legacy.replace('function selectSessionQuestions(save,lesson,pool,{min=30,max=40}={}){','function selectSessionQuestions(save,lesson,pool,{min=30,max=40}={}){const academic=window.POWDER_ACADEMIC_CONTENT_V2113,planned=academic?.planSession?.(save,lesson,pool,{min,max});if(Array.isArray(planned)&&planned.length)return planned;');
              s=s.replace(selectRe,body+'\nfunction grade');
            }
            fs.writeFileSync(f,s);
          }
          // Rebind historical deterministic refreshers to the new exact boot shape.
          for(const f of ['tools/powder-refresh-boot-manifest-v2110.mjs','tools/powder-refresh-boot-manifest-v2111.mjs','tools/powder-refresh-boot-manifest-v2112.mjs']){
            let s=fs.readFileSync(f,'utf8').replace(/manifest\.length!==1294/g,'manifest.length!==1295').replace(/order\.length!==132/g,'order.length!==133');
            if(f.endsWith('v2110.mjs')&&!s.includes('academicIndex=')){
              s=s.replace("learningIndex=order.indexOf('js/learning-question-engine-v2112.js'),details=","academicIndex=order.indexOf('js/learning-academic-content-v2113.js'),learningIndex=order.indexOf('js/learning-question-engine-v2112.js'),details=");
              s=s.replace('learningIndex,appIndex,runtimeIndex','academicIndex,learningIndex,appIndex,runtimeIndex');
              s=s.replace('learningIndex!==appIndex-1||runtimeIndex!==appIndex+1','academicIndex!==learningIndex-1||learningIndex!==appIndex-1||runtimeIndex!==appIndex+1');
            }
            if(f.endsWith('v2111.mjs')&&!s.includes('academicIndex=')){
              s=s.replace("onboardingIndex=order.indexOf(target),learningIndex=order.indexOf('js/learning-question-engine-v2112.js'),appIndex=","onboardingIndex=order.indexOf(target),academicIndex=order.indexOf('js/learning-academic-content-v2113.js'),learningIndex=order.indexOf('js/learning-question-engine-v2112.js'),appIndex=");
              s=s.replace('onboardingIndex,learningIndex,appIndex','onboardingIndex,academicIndex,learningIndex,appIndex');
              s=s.replace('onboardingIndex<0||learningIndex!==appIndex-1','onboardingIndex<0||academicIndex!==learningIndex-1||learningIndex!==appIndex-1');
            }
            if(f.endsWith('v2112.mjs')&&!s.includes('academicIndex=')){
              s=s.replace("const appIndex=order.indexOf(app),engineIndex=order.indexOf(engine),journeyIndex=","const appIndex=order.indexOf(app),engineIndex=order.indexOf(engine),academicIndex=order.indexOf('js/learning-academic-content-v2113.js'),journeyIndex=");
              s=s.replace('engineIndex,appIndex,journeyIndex','academicIndex,engineIndex,appIndex,journeyIndex');
              s=s.replace('engineIndex<0||engineIndex!==appIndex-1','engineIndex<0||academicIndex!==engineIndex-1||engineIndex!==appIndex-1');
            }
            fs.writeFileSync(f,s);
          }
          // Extend the final regression gate; keep every previous check intact.
          {
            const f='tools/powder-final-gate-v21004.mjs';let s=fs.readFileSync(f,'utf8');
            s=s.replace(/manifest\.length===1294/g,'manifest.length===1295').replace(/order\.length===132/g,'order.length===133');
            if(!s.includes('academicContentIndex='))s=s.replace("mobileIndex=order.indexOf('js/mobile-touch-runtime-v21014.js'),learningQuestionEngineIndex=","mobileIndex=order.indexOf('js/mobile-touch-runtime-v21014.js'),academicContentIndex=order.indexOf('js/learning-academic-content-v2113.js'),learningQuestionEngineIndex=");
            s=s.replace('mobileIndex===learningQuestionEngineIndex-1&&learningQuestionEngineIndex===appIndex-1','mobileIndex===academicContentIndex-1&&academicContentIndex===learningQuestionEngineIndex-1&&learningQuestionEngineIndex===appIndex-1');
            if(!s.includes('academicContentSource='))s=s.replace("combatWarmupSource=read('js/combat-warmup-v21019.js'),learningQuestionEngineSource=","combatWarmupSource=read('js/combat-warmup-v21019.js'),academicContentSource=read('js/learning-academic-content-v2113.js'),learningQuestionEngineSource=");
            if(!s.includes("ok('academicContent2113Integration'")){
              const marker="ok('learningQuestionEngineIntegration'";const at=s.indexOf(marker);if(at<0)throw new Error('learning engine final-gate marker missing');
              const check="ok('academicContent2113Integration',academicContentSource.includes(\"VERSION='21.1.3'\")&&academicContentSource.includes('HSK1 · Nền tảng')&&academicContentSource.includes('B1+ → B2 · Bridge')&&academicContentSource.includes('context_cloze')&&academicContentSource.includes('word_in_context')&&academicContentSource.includes('planSession')&&!academicContentSource.includes('POWDER_DATA')&&!academicContentSource.includes('D.questions')&&!academicContentSource.includes('setInterval')&&!academicContentSource.includes('MutationObserver')&&learningQuestionEngineSource.includes('POWDER_ACADEMIC_CONTENT_V2113')&&manifest.some(x=>x.u==='js/learning-academic-content-v2113.js'&&x.k==='script')&&academicContentIndex===learningQuestionEngineIndex-1&&learningQuestionEngineIndex===appIndex-1,{academicContentIndex,learningQuestionEngineIndex,appIndex});\n";
              s=s.slice(0,at)+check+s.slice(at);
            }
            s=s.replace('powder-refresh-boot-manifest-v2112.mjs','powder-refresh-boot-manifest-v2113.mjs');
            fs.writeFileSync(f,s);
          }
          NODE
      - name: Refresh boot integrity
        run: node tools/powder-refresh-boot-manifest-v2113.mjs . --write
      - name: Verify final integration
        run: |
          node --check js/learning-academic-content-v2113.js
          node --check js/learning-question-engine-v2112.js
          node --check tools/powder-academic-content-gate-v2113.mjs
          node --check tools/powder-refresh-boot-manifest-v2113.mjs
          node --check tools/powder-final-gate-v21004.mjs
          node tools/powder-refresh-boot-manifest-v2113.mjs .
          node tools/powder-academic-content-gate-v2113.mjs .
          node tools/powder-final-gate-v21004.mjs .
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/learning-question-engine-v2112.js js/boot-loader-v21004.js tools/powder-final-gate-v21004.mjs tools/powder-refresh-boot-manifest-v2110.mjs tools/powder-refresh-boot-manifest-v2111.mjs tools/powder-refresh-boot-manifest-v2112.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: integrate academic content 21.1.3 [v2113-finalize]"
          git push origin HEAD:upgrade/21.1.3-academic-content-expansion
