name: Powder Visual Performance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: powder-visual-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Chrome
        run: google-chrome --version
      - name: Visual regression and performance budgets
        run: node tools/powder-visual-performance-gate-v21016.mjs .
      - name: Upload visual/performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powder-visual-performance-${{ github.sha }}
          path: artifacts/visual-v21008/
          if-no-files-found: error
          retention-days: 14
