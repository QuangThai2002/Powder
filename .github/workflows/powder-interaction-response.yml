name: Powder Interaction Response

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interaction-response:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Chrome
        run: google-chrome --version
      - name: Run interaction response gate
        run: node tools/powder-interaction-response-gate-v21013.mjs .
      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powder-interaction-response-${{ github.sha }}
          path: artifacts/interaction-v21013/
          if-no-files-found: warn
          retention-days: 14
