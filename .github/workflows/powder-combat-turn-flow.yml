name: Powder Combat Turn Flow

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: powder-combat-turn-flow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  combat-turn-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Chrome
        run: google-chrome --version
      - name: Run combat turn flow gate
        run: node tools/powder-combat-turn-flow-gate-v21017.mjs .
      - name: Upload combat turn flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powder-combat-turn-flow-${{ github.sha }}
          path: artifacts/combat-turn-flow-v21017/
          if-no-files-found: warn
          retention-days: 14
