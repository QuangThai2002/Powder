name: Powder Scene Transition

on:
  pull_request:
  push:
    branches:
      - main
      - upgrade/21.0.12-scene-transition-asset-residency

permissions:
  contents: read

concurrency:
  group: powder-scene-transition-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scene-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Chrome
        run: google-chrome --version || google-chrome-stable --version || chromium --version
      - name: Run scene transition gate
        run: node tools/powder-scene-transition-gate-v21012.mjs .
      - name: Upload scene transition evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: powder-scene-transition-${{ github.sha }}
          path: artifacts/scene-transition-v21012/
          retention-days: 14
