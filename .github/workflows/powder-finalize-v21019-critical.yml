name: Powder 21.0.19 Critical Finalize

on:
  push:
    branches:
      - upgrade/21.0.19-combat-warmup-zero-stutter

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v21019-critical-finalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/21.0.19-combat-warmup-zero-stutter
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Make critical warmup budget explicit
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='js/combat-warmup-v21019.js';
          let s=fs.readFileSync(file,'utf8');
          const old="function limits(level=pressure()){return level==='calm'?{cap:3,team:5,enemy:3,skills:5,max:15}:level==='warm'?{cap:2,team:3,enemy:3,skills:4,max:12}:level==='hot'?{cap:1,team:3,enemy:1,skills:0,max:6}:{cap:0,team:0,enemy:0,skills:0,max:0}}";
          const next="function limits(level=pressure()){if(level==='critical')return{cap:0,team:0,enemy:0,skills:0,max:0};if(level==='hot')return{cap:1,team:3,enemy:1,skills:0,max:6};if(level==='warm')return{cap:2,team:3,enemy:3,skills:4,max:12};return{cap:3,team:5,enemy:3,skills:5,max:15}}";
          if(!s.includes(old)&&!s.includes("level==='critical'"))throw new Error('21.0.19 limits anchor not found');
          if(s.includes(old))s=s.replace(old,next);
          fs.writeFileSync(file,s);
          NODE
      - name: Refresh boot integrity
        run: node tools/powder-refresh-boot-manifest-v21019.mjs . --write
      - name: Verify generated integration
        run: |
          node --check js/combat-warmup-v21019.js
          node tools/powder-refresh-boot-manifest-v21019.mjs .
          node tools/powder-final-gate-v21004.mjs .
      - name: Commit finalized runtime and boot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/combat-warmup-v21019.js js/boot-loader-v21004.js
          if git diff --cached --quiet; then
            echo "21.0.19 critical budget already finalized"
            exit 0
          fi
          git commit -m "fix: make 21.0.19 critical warmup budget explicit [v21019-critical-finalize]"
          git push origin HEAD:upgrade/21.0.19-combat-warmup-zero-stutter
