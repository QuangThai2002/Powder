name: Powder 21.0.18 Manifest Refresh

on:
  push:
    branches:
      - upgrade/21.0.18-combat-skill-identity

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[v21018-manifest]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/21.0.18-combat-skill-identity
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh boot integration
        run: node tools/powder-refresh-boot-manifest-v21018.mjs . --write
      - name: Commit generated boot
        shell: bash
        run: |
          if git diff --quiet -- js/boot-loader-v21004.js; then
            echo "Boot already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/boot-loader-v21004.js
          git commit -m "build: bind 21.0.18 combat skill identity [v21018-manifest]"
          git push origin HEAD:upgrade/21.0.18-combat-skill-identity
