name: Powder Combat Check

on:
  push:
    branches: [main]
    paths:
      - 'src/game/combat2/**'
      - 'combat2.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.*'
      - '.github/workflows/combat2-check.yml'
  pull_request:
    paths:
      - 'src/game/combat2/**'
      - 'combat2.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.*'
      - '.github/workflows/combat2-check.yml'

permissions:
  contents: read

jobs:
  combat-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, build and asset audit
        run: npm run check
