name: Combat runtime fix 22.0.1

on:
  push:
    paths:
      - '.github/workflows/combat-runtime-fix-v2201.yml'

permissions:
  contents: write

jobs:
  patch-combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch combat scene, audio and preload cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old,new,1)

          scene_path=Path('js/player-combat-scene-v1862.js')
          scene=scene_path.read_text(encoding='utf-8')
          scene=replace_once(scene,"""  function telegraphPause(key){
            if(key==='ultimate') return 2100;
            if(key==='exclusive') return 1500;
            if(key==='skill2') return 1200;
            if(key==='skill1') return 1050;
            return 900;
          }""","""  function telegraphPause(key){
            // 22.0.1: input-to-impact must feel immediate. Readability comes from visual cues,
            // not from blocking the combat state machine for multiple seconds.
            if(key==='ultimate') return 980;
            if(key==='exclusive') return 820;
            if(key==='skill2') return 680;
            if(key==='skill1') return 560;
            return 440;
          }""",'telegraph timing')
          scene=replace_once(scene,"""    if(unit.boss) total += key==='ultimate'?1050:key==='exclusive'?850:key==='skill2'?650:key==='skill1'?520:360;""","""    if(unit.boss) total += key==='ultimate'?420:key==='exclusive'?340:key==='skill2'?260:key==='skill1'?210:170;""",'boss presentation timing')
          scene=replace_once(scene,"""    const prep=await preCastTelegraph(u,q.key,ability,q.targetId);
            if(prep?.canceled)return;
            await sleep(prep?.impactDelay||0);""","""    let prep=null;
            try{prep=await preCastTelegraph(u,q.key,ability,q.targetId);}
            catch(error){
              console.warn('[Combat 22.0.1] presentation failed; gameplay continues',error);
              prep={impactDelay:0,settleDelay:0,canceled:false};
            }
            if(prep?.canceled){
              clearAttackPresentation(u.id);patchAttackPresentationDom();
              prep={impactDelay:0,settleDelay:0,canceled:false};
            }
            await sleep(prep?.impactDelay||0);""",'player presentation recovery')
          scene=replace_once(scene,"""        const prep=await preCastTelegraph(step.unit,d.key,d.ability,d.targetId,d); if(token!==flowToken||prep?.canceled)return;
                await sleep(prep?.impactDelay||0); if(token!==flowToken)return;""","""        let prep=null;
                try{prep=await preCastTelegraph(step.unit,d.key,d.ability,d.targetId,d);}
                catch(error){
                  console.warn('[Combat 22.0.1] enemy presentation failed; gameplay continues',error);
                  prep={impactDelay:0,settleDelay:0,canceled:false};
                }
                if(token!==flowToken)return;
                if(prep?.canceled){
                  clearAttackPresentation(step.unit.id);patchAttackPresentationDom();
                  prep={impactDelay:0,settleDelay:0,canceled:false};
                }
                await sleep(prep?.impactDelay||0); if(token!==flowToken)return;""",'enemy presentation recovery')
          scene_path.write_text(scene,encoding='utf-8')

          audio_path=Path('js/combat-audio-v7.js')
          audio=audio_path.read_text(encoding='utf-8')
          new_telegraph="""    async telegraph(unit,key,ability,profile={}){
              await this.ensure();this.stats.telegraphs++;if(!this.dedup(`tele:${unit?.id}:${key}`,100))return;
              const element=String(unit?.element||'neutral').toLowerCase(),role=String(profile.role||unit?.combatRole||'').toLowerCase(),ef=this.elementBase(element),rf=this.roleBase(role);
              this.track(`telegraph:${key}`);
              if(key==='ultimate'){
                this.tone({freq:62,to:108,type:'sine',gain:.072,duration:.42,attack:.025,release:.16});
                this.tone({freq:ef*.62,to:ef*1.12,type:'triangle',gain:.03,duration:.31,delay:.055,attack:.012,release:.11});
                this.noise({gain:.019,duration:.16,filter:920,type:'bandpass',delay:.07});this.vibrate([18,18,28]);return;
              }
              if(key==='exclusive'){
                this.tone({freq:78,to:132,type:'sine',gain:.058,duration:.34,attack:.02,release:.12});
                this.tone({freq:ef*.72,to:ef*1.04,type:'triangle',gain:.025,duration:.24,delay:.035});return;
              }
              if(key==='skill2'){this.tone({freq:ef*.72,to:ef*1.06,type:'triangle',gain:.028,duration:.18});this.noise({gain:.012,duration:.07,filter:1600,type:'bandpass'});return;}
              if(key==='skill1'){this.tone({freq:ef*.82,to:ef*1.02,type:'sine',gain:.023,duration:.135});return;}
              if(role==='marksman'){this.noise({gain:.018,duration:.045,filter:2900,type:'highpass'});this.tone({freq:rf,to:rf*1.06,type:'square',gain:.014,duration:.045});}
              else if(role==='assassin'){this.noise({gain:.022,duration:.09,filter:1850,type:'bandpass'});this.tone({freq:ef,to:ef*1.28,type:'triangle',gain:.019,duration:.11});}
              else if(role==='mage'||role==='enchanter'||role==='healer'){this.tone({freq:ef*.85,to:ef*1.12,type:'sine',gain:.026,duration:.16,attack:.025,release:.07});}
              else {this.tone({freq:ef*.78,to:ef*.96,type:'triangle',gain:.022,duration:.11});}
            }"""
          pat=r"    async telegraph\(unit,key,ability,profile=\{\}\)\{.*?\n    \}\n\n    async release"
          audio,n=re.subn(pat,new_telegraph+"\n\n    async release",audio,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'audio telegraph: expected 1 match, got {n}')

          new_release="""    async release(unit,key,ability,profile={}){
              await this.ensure();this.stats.releases++;if(!this.dedup(`release:${unit?.id}:${key}`,100))return;
              const role=String(profile.role||unit?.combatRole||'').toLowerCase(),element=String(unit?.element||'neutral').toLowerCase(),ef=this.elementBase(element);
              this.track(`release:${key}`);
              if(key==='ultimate'){
                this.noise({gain:.068,duration:.12,filter:1450,type:'bandpass'});
                this.tone({freq:ef*1.18,to:ef*.48,type:'sawtooth',gain:.05,duration:.26,attack:.004,release:.1});
                this.tone({freq:92,to:54,type:'sine',gain:.068,duration:.29,release:.14});return;
              }
              if(key==='exclusive'){this.noise({gain:.05,duration:.1,filter:1260,type:'bandpass'});this.tone({freq:ef*1.06,to:ef*.58,type:'sawtooth',gain:.04,duration:.21});return;}
              if(key==='skill2'){this.noise({gain:.032,duration:.075,filter:1700,type:'bandpass'});this.tone({freq:ef*1.02,to:ef*.68,type:'triangle',gain:.031,duration:.16});return;}
              if(key==='skill1'){this.noise({gain:.021,duration:.06,filter:1900,type:'bandpass'});this.tone({freq:ef,to:ef*.78,type:'triangle',gain:.026,duration:.12});return;}
              if(role==='marksman'){this.noise({gain:.038,duration:.04,filter:3600,type:'highpass'});this.tone({freq:880,to:580,type:'square',gain:.018,duration:.055});}
              else if(role==='assassin'||role==='knight'){this.noise({gain:.038,duration:.085,filter:2250,type:'bandpass'});this.tone({freq:ef*1.18,to:ef*.78,type:'triangle',gain:.024,duration:.11});}
              else if(role==='mage'||role==='enchanter'){this.tone({freq:ef*1.18,to:ef*.8,type:'sine',gain:.035,duration:.14});this.noise({gain:.017,duration:.1,filter:2800,type:'highpass'});}
              else if(role==='healer')this.tone({freq:ef,type:'sine',gain:.026,duration:.13});
              else {this.tone({freq:118,to:76,type:'sine',gain:.042,duration:.11});this.noise({gain:.032,duration:.08,filter:760,type:'lowpass'});}
            }"""
          pat=r"    async release\(unit,key,ability,profile=\{\}\)\{.*?\n    \}\n\n    async impact"
          audio,n=re.subn(pat,new_release+"\n\n    async impact",audio,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'audio release: expected 1 match, got {n}')

          new_impact="""    async impact({crit=false,absorbed=0,element='neutral',amount=0,strong=false}={}){
              await this.ensure();const e=String(element||'neutral').toLowerCase(),f=this.elementBase(e);this.track(crit?'impact:crit':'impact');
              const weight=strong?1.16:1;
              this.noise({gain:(strong?.068:crit?.058:.04)*weight,duration:strong?.125:.075,filter:e==='steel'||e==='earth'?620:e==='lightning'?3400:1250,type:e==='lightning'?'highpass':'bandpass'});
              this.tone({freq:strong?108:crit?142:178,to:strong?58:crit?84:116,type:'sine',gain:(strong?.078:crit?.06:.042)*weight,duration:strong?.23:.145,attack:.003,release:.08});
              if(['fire','lava'].includes(e))this.noise({gain:.026,duration:.13,filter:980,type:'lowpass',delay:.02});
              if(['water','ice'].includes(e))this.tone({freq:f*1.24,to:f*.88,type:'sine',gain:.021,duration:.15,delay:.015});
              if(['lightning','storm'].includes(e)){this.tone({freq:f*1.5,to:f*.7,type:'square',gain:.024,duration:.06});this.noise({gain:.026,duration:.05,filter:4600,type:'highpass'});}
              if(['light','dark','poison'].includes(e))this.tone({freq:f,to:f*.82,type:'triangle',gain:.021,duration:.16,delay:.015});
              if(absorbed>0)this.tone({freq:620,to:430,type:'triangle',gain:.026,duration:.105});
              if(crit){this.tone({freq:1020,type:'triangle',gain:.036,duration:.09});this.tone({freq:1370,type:'sine',gain:.026,duration:.11,delay:.035});this.vibrate([14,12,24]);}
              else this.vibrate(amount>0?12:6);
            }"""
          pat=r"    async impact\(\{crit=false,absorbed=0,element='neutral',amount=0,strong=false\}=\{\}\)\{.*?\n    \}\n\n    async guard"
          audio,n=re.subn(pat,new_impact+"\n\n    async guard",audio,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'audio impact: expected 1 match, got {n}')
          audio_path.write_text(audio,encoding='utf-8')

          boot_path=Path('js/boot-loader-v21004.js')
          boot=boot_path.read_text(encoding='utf-8')
          boot=re.sub(r"CACHE_NAME='powder-assets-v[^']+'","CACHE_NAME='powder-assets-v22001'",boot,count=1)
          boot=re.sub(r"COMPLETE_KEY='powder_preload_complete_v[^']+'","COMPLETE_KEY='powder_preload_complete_v22001'",boot,count=1)
          boot=re.sub(r"INDEX_KEY='powder_preload_index_v[^']+'","INDEX_KEY='powder_preload_index_v22001'",boot,count=1)

          for rel in ['js/combat-audio-v7.js','js/player-combat-scene-v1862.js']:
              raw=Path(rel).read_bytes();size=len(raw);rev=hashlib.sha256(raw).hexdigest()[:12]
              pat=r'(\{"u":"'+re.escape(rel)+r'","s":)\d+(,"r":")[^"]+("[^}]*\})'
              boot,n=re.subn(pat,lambda m:f'{m.group(1)}{size}{m.group(2)}{rev}{m.group(3)}',boot,count=1)
              if n!=1: raise SystemExit(f'boot manifest {rel}: expected 1 match, got {n}')
          manifest_token=hashlib.sha256((Path('js/combat-audio-v7.js').read_text(encoding='utf-8')+Path('js/player-combat-scene-v1862.js').read_text(encoding='utf-8')).encode()).hexdigest()[:16]
          boot=re.sub(r'MANIFEST_HASH="[^"]+"',f'MANIFEST_HASH="{manifest_token}"',boot,count=1)
          boot_path.write_text(boot,encoding='utf-8')
          PY
          node --check js/player-combat-scene-v1862.js
          node --check js/combat-audio-v7.js
          node --check js/boot-loader-v21004.js
          node --check js/combat-player-experience-v2201.js
          git diff --check
      - name: Commit patched runtime
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No runtime changes required.'
            exit 0
          fi
          git config user.name 'Powder Combat Build'
          git config user.email 'actions@github.com'
          git add js/player-combat-scene-v1862.js js/combat-audio-v7.js js/boot-loader-v21004.js
          git commit -m 'Combat 22.0.1: prevent cast lock and refresh action audio'
          git push
