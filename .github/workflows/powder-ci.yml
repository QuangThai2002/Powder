name: Powder CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: powder-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin-combat-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runner Node diagnostics
        run: node --version
      - name: Syntax check Admin Combat and Combat presentation
        run: |
          node --check js/admin-combat-lab-v1882.js
          node --check js/admin-combat-real-launcher-v2140.js
          node --check js/admin-domain-pipeline-v2175.js
          node --check js/domain-system-export-recovery-v2140.js
          node --check js/combat-runtime-qa-bridge-v2140.js
          node --check js/combat-fx-fidelity-v2141.js
          node --check js/combat-role-rhythm-v2142.js
          node --check js/combat-impact-sequence-v2143.js
          node --check js/combat-impact-legibility-v2144.js
          node --check js/combat-status-fx-v2145.js
          node --check js/combat-camera-hit-v2146.js
          node --check js/combat-ultimate-identity-v2147.js
          node --check js/combat-fx-budget-v2148.js
          node --check js/combat-magic-circle-v2149.js
          node --check js/combat-grand-magic-v2150.js
          node --check js/combat-spell-chain-v2151.js
          node --check js/combat-magic-finish-v2152.js
          node --check js/combat-spell-projectile-v2153.js
          node --check js/combat-elemental-clash-v2154.js
          node --check js/combat-barrier-magic-v2155.js
          node --check js/combat-magic-scene-director-v2156.js
          node --check js/combat-cast-choreography-v2157.js
          node --check js/combat-elemental-field-v2158.js
          node --check js/combat-ultimate-camera-v2159.js
          node --check js/combat-arcane-polish-v2160.js
          node --check js/combat-motion-realism-v2161.js
          node --check js/combat-signature-ultimate-v2162.js
          node --check js/combat-reaction-physics-v2163.js
          node --check js/combat-final-director-v2164.js
          node --check js/combat-domain-turn-economy-v2165.js
          node --check js/combat-domain-clash-v2166.js
          node --check js/combat-domain-clash-authority-v2167.js
          node --check js/combat-domain-learning-edge-v2168.js
          node --check js/combat-domain-supremacy-v2169.js
          node --check js/combat-domain-server-authority-v2170.js
          node --check js/pvp-domain-charge-v2172.js
          node --check js/combat-skill-inspector-v2187.js
          node --check js/combat-command-readability-v2188.js
          node --check js/combat-reserve-entry-v2189.js
          node --check js/combat-turn-flow-v2190.js
          node --check js/performance-director-v21221.js
          node --check js/admin-capacity-guard-v21004.js
          node --check tools/powder-admin-combat-contract-v2140.mjs
          node --check tools/powder-combat-final-contract-v2164.mjs
          node --check tools/powder-domain-clash-contract-v2166.mjs
          node --check tools/powder-domain-learning-edge-contract-v2168.mjs
          node --check tools/powder-domain-supremacy-contract-v2169.mjs
          node --check tools/powder-domain-clash-server-contract-v2170.mjs
          node --check tools/powder-domain-supremacy-server-contract-v2171.mjs
          node --check tools/powder-domain-charge-server-contract-v2172.mjs
          node --check tools/powder-domain-round-hardening-contract-v2173.mjs
          node --check tools/powder-domain-clash-turn-freeze-contract-v2174.mjs
          node --check tools/powder-admin-domain-pipeline-contract-v2175.mjs
          node --check tools/powder-combat-command-readability-contract-v2188.mjs
          node --check tools/powder-combat-reserve-entry-contract-v2189.mjs
          node --check tools/powder-combat-turn-flow-contract-v2190.mjs

  admin-combat-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Admin Real Combat 21.4.0 regression contract
        run: node tools/powder-admin-combat-contract-v2140.mjs .

  admin-domain-pipeline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Admin Domain Full-Pipeline 21.7.5 contract
        run: node tools/powder-admin-domain-pipeline-contract-v2175.mjs .

  combat-final-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Final Combat Director 21.6.4 contract
        run: node tools/powder-combat-final-contract-v2164.mjs .

  combat-command-readability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Combat Command Readability 21.8.8 contract
        run: node tools/powder-combat-command-readability-contract-v2188.mjs .

  combat-reserve-entry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Combat Reserve Entry 21.8.9 contract
        run: node tools/powder-combat-reserve-entry-contract-v2189.mjs .

  combat-turn-flow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Combat Turn Flow 21.9.0 contract
        run: node tools/powder-combat-turn-flow-contract-v2190.mjs .

  domain-clash-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Domain Clash 21.6.6 contract
        run: node tools/powder-domain-clash-contract-v2166.mjs .

  domain-learning-edge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Domain Learning Edge 21.6.8 contract
        run: node tools/powder-domain-learning-edge-contract-v2168.mjs .

  domain-supremacy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Domain Supremacy 21.6.9 contract
        run: node tools/powder-domain-supremacy-contract-v2169.mjs .

  domain-clash-server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Domain Clash Server Authority 21.7.0 contract
        run: node tools/powder-domain-clash-server-contract-v2170.mjs .

  domain-supremacy-server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Domain Supremacy Server Parity 21.7.1 contract
        run: node tools/powder-domain-supremacy-server-contract-v2171.mjs .

  domain-charge-server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Domain Charge Server Economy 21.7.2 contract
        run: node tools/powder-domain-charge-server-contract-v2172.mjs .

  domain-round-hardening-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Domain Round / Reserve Hardening 21.7.3 contract
        run: node tools/powder-domain-round-hardening-contract-v2173.mjs .

  domain-clash-turn-freeze-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Domain Clash Turn Freeze 21.7.4 contract
        run: node tools/powder-domain-clash-turn-freeze-contract-v2174.mjs .

  project-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Project hygiene and runtime integrity
        run: node tools/powder-project-gate-v21214.mjs .
      - name: Verify clean checkout
        run: git diff --exit-code

  browser-e2e:
    if: ${{ always() }}
    needs: project-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare browser E2E diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p artifacts/e2e-v21007
          if node --check tools/powder-browser-e2e-v21007.mjs > artifacts/e2e-v21007/SYNTAX-CHECK.txt 2>&1; then
            echo "syntax=ok" >> artifacts/e2e-v21007/SYNTAX-CHECK.txt
          else
            echo "syntax=failed" >> artifacts/e2e-v21007/SYNTAX-CHECK.txt
          fi
      - name: Run Powder browser E2E
        run: node tools/powder-browser-e2e-v21007.mjs .
      - name: Upload browser E2E diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: powder-browser-e2e-${{ github.run_attempt }}
          path: artifacts/e2e-v21007
          if-no-files-found: warn
          retention-days: 7
