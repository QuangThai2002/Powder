name: Powder 21.1.3 Spotlight Integrator

on:
  push:
    branches: [upgrade/21.1.3-academic-content-expansion]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[v2113-spotlight]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/21.1.3-academic-content-expansion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch onboarding spotlight
        run: node tools/powder-fix-onboarding-spotlight-v2113.mjs
      - name: Refresh boot integrity
        run: node tools/powder-refresh-boot-manifest-v2113.mjs . --write
      - name: Verify integration and behavior
        run: |
          google-chrome --version
          node --check js/onboarding-v146.js
          node --check js/learning-academic-content-v2113.js
          node tools/powder-refresh-boot-manifest-v2113.mjs .
          node tools/powder-academic-content-gate-v2113.mjs .
          node tools/powder-final-gate-v21004.mjs .
          node tools/powder-onboarding-discovery-gate-v2111.mjs .
      - name: Commit spotlight fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/onboarding-v146.js js/boot-loader-v21004.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: keep onboarding spotlight aligned to full target [v2113-spotlight]"
          git push origin HEAD:upgrade/21.1.3-academic-content-expansion
