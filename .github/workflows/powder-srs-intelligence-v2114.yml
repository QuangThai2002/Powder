name: Powder SRS Intelligence 21.1.4

on:
  push:
    branches: [main]
    paths:
      - 'js/learning-srs-intelligence-v2114.js'
      - 'tools/powder-srs-intelligence-gate-v2114.mjs'
      - '.github/workflows/powder-srs-intelligence-v2114.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powder-srs-intelligence-v2114
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax guard
        run: |
          node --check js/learning-srs-intelligence-v2114.js
          node --check tools/powder-srs-intelligence-gate-v2114.mjs

      - name: SRS intelligence regression
        run: node tools/powder-srs-intelligence-gate-v2114.mjs .

      - name: Academic content regression
        run: node tools/powder-academic-content-gate-v2113.mjs .

      - name: Learning question engine regression
        run: node tools/powder-learning-question-engine-gate-v2112.mjs .

      - name: Final regression gate
        run: node tools/powder-final-gate-v21004.mjs .

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powder-srs-intelligence-v2114
          path: |
            artifacts/srs-intelligence-v2114
            artifacts/academic-content-v2113
            artifacts/learning-question-engine-v2112
          if-no-files-found: ignore
