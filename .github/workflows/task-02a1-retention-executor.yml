name: Task 02A-1 retention executor

on:
  push:
    branches:
      - work/adventure-combat-entry-user-test-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "work/adventure-combat-entry-user-test-v1"
          git merge-base --is-ancestor f68725970a811ada89e1c0ad5f5e69264d881976 HEAD
          test -z "$(git status --short)"

      - name: Patch stale battle reward protection
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          function replaceExact(file,from,to){
            const src=fs.readFileSync(file,'utf8');
            const parts=src.split(from);
            if(parts.length!==2)throw new Error(`${file}: exact anchor count ${parts.length-1}, expected 1`);
            fs.writeFileSync(file,parts[0]+to+parts[1]);
          }
          function replaceRange(file,start,end,replacement){
            const src=fs.readFileSync(file,'utf8');
            const first=src.indexOf(start), second=src.indexOf(start,first+1);
            if(first<0||second>=0)throw new Error(`${file}: start anchor count != 1`);
            const stop=src.indexOf(end,first+start.length), stop2=src.indexOf(end,stop+end.length);
            if(stop<0||stop2>=0)throw new Error(`${file}: end anchor count != 1`);
            fs.writeFileSync(file,src.slice(0,first)+replacement+src.slice(stop));
          }

          // Shared authority: retain exact recent receipts, plus permanent monotonic boundary.
          const authorityFile='js/player-state-authority-v1.js';
          const validBattle="function validBattleId(value){return typeof value==='string'&&/^[A-Za-z0-9._:-]{1,160}$/.test(value.trim());}\n";
          const boundaryHelpers=validBattle+"function normalizeBattleCreatedAt(value){const number=Number(value);return Number.isFinite(number)&&number>0?Math.floor(number):0;}\nfunction battleRewardBoundary(snapshot){const raw=snapshot?.saveMeta?.battleRewardBoundary,createdAt=normalizeBattleCreatedAt(raw?.battleCreatedAt),battleId=String(raw?.battleId||'').trim();return raw?.version===1&&createdAt>0&&validBattleId(battleId)?{version:1,battleCreatedAt:createdAt,battleId,settledAt:safeInt(raw?.settledAt)}:null;}\nfunction selectBattleRewardBoundary(source,current){const a=battleRewardBoundary(source),b=battleRewardBoundary(current);if(a&&b&&a.battleCreatedAt===b.battleCreatedAt&&a.battleId!==b.battleId)return{collision:true,boundary:null};if(!a)return{collision:false,boundary:b};if(!b)return{collision:false,boundary:a};return{collision:false,boundary:a.battleCreatedAt>=b.battleCreatedAt?a:b};}\nfunction staleBattleRewardResult(battleId,snapshot){return{ok:true,duplicate:true,stale:true,reason:'battle-reward-stale-settled',battleId,granted:{coins:0,exp:0,wins:0},balances:balances(snapshot),snapshot:clone(snapshot)};}\n";
          replaceExact(authorityFile,validBattle,boundaryHelpers);
          const applyStart='function applyOfflineBattleReward(input={}){';
          const applyEnd='\nroot.POWDER_PLAYER_STATE_AUTHORITY_V1=';
          const applyReplacement=`function applyOfflineBattleReward(input={}){if(input.authorityMode!=='offline')return{ok:false,reason:'server-authority-required'};const battleId=String(input.battleId||'').trim();if(!validBattleId(battleId))return{ok:false,reason:'invalid-battle-id'};const base=storageKey(input.storageKey);if(!base)return{ok:false,reason:'storage-key-missing'};const loaded=rawLoad(base),current=loaded.snapshot,source=input.snapshot&&typeof input.snapshot==='object'?clone(input.snapshot):clone(current);if(!source||typeof source!=='object')return{ok:false,reason:'invalid-snapshot'};const recovery=reconcile(base,current);const committed=readJournal(base).records.find(item=>item.battleId===battleId&&item.state==='committed')||(recovery?.record?.battleId===battleId?recovery.record:null);if(committed)return receiptFromRecord(committed,current,true);if(recovery)return{ok:false,reason:recovery.state==='ambiguous'?'battle-reward-recovery-ambiguous':'battle-reward-recovery-pending'};
const battleCreatedAt=normalizeBattleCreatedAt(input.battleCreatedAt);if(!battleCreatedAt)return{ok:false,reason:'invalid-battle-created-at'};const boundaryState=selectBattleRewardBoundary(source,current);if(boundaryState.collision)return{ok:false,reason:'battle-reward-boundary-collision',battleId,balances:balances(source),snapshot:clone(source)};const boundary=boundaryState.boundary;if(boundary){if(battleCreatedAt<boundary.battleCreatedAt)return staleBattleRewardResult(battleId,source);if(battleCreatedAt===boundary.battleCreatedAt){if(battleId===boundary.battleId)return staleBattleRewardResult(battleId,source);return{ok:false,reason:'battle-reward-boundary-collision',battleId,balances:balances(source),snapshot:clone(source)};}}
const rewardId=String(input.rewardId||'').trim()||null,granted={coins:safeInt(input.coins),exp:safeInt(input.exp),wins:safeInt(input.wins)},before=balances(source),after={coins:before.coins+granted.coins,exp:before.exp+granted.exp,wins:before.wins+granted.wins},appliedAt=Date.now(),transactionId=\`battle-reward:\${battleId}:\${appliedAt}\`;
const tx={version:1,transactionId,battleId,rewardId,battleCreatedAt,state:'pending',granted,before,after,appliedAt};if(!set(txKey(base),JSON.stringify(tx)))return{ok:false,reason:'transaction-marker-write-failed'};const pending={battleId,rewardId,battleCreatedAt,state:'pending',granted,balances:after,appliedAt,transactionId};if(!upsertRecord(base,pending)){remove(txKey(base));return{ok:false,reason:'journal-pending-write-failed'};}
const next=clone(source);next.coins=after.coins;next.exp=after.exp;next.wins=after.wins;next.saveMeta={...(next.saveMeta&&typeof next.saveMeta==='object'?next.saveMeta:{}),lastSavedAt:appliedAt,lastReason:'battle-reward-authority',lastBattleRewardTx:{version:1,battleId,transactionId,appliedAt},battleRewardBoundary:{version:1,battleCreatedAt,battleId,settledAt:appliedAt}};const commit=atomicCommit(next,{storageKey:base});if(!commit.ok){removeRecord(base,battleId,'pending');remove(txKey(base));return{ok:false,reason:commit.reason||'player-save-failed',snapshot:clone(source),balances:before};}
const committedRecord={...pending,state:'committed'};const journalCommitted=upsertRecord(base,committedRecord);if(journalCommitted)remove(txKey(base));return receiptFromRecord(committedRecord,commit.snapshot,false);}`;
          replaceRange(authorityFile,applyStart,applyEnd,applyReplacement);

          // Main: only receive/plumb canonical createdAt; reward mutation remains authority-owned.
          const appFile='js/app.js';
          const appOld="grantBattleRewards:({battleId='',rewardId='',coins=0,exp=0,wins=0}={})=>{const SEC=window.POWDER_SECURE_ECONOMY_V152;if(SEC?.hasAccount?.())return{ok:false,coins:P.coins,exp:P.exp,wins:P.wins,knowledge:P.knowledge||0,serverProtected:true,rewardLocked:true};const authority=window.POWDER_PLAYER_STATE_AUTHORITY_V1;if(typeof authority?.applyOfflineBattleReward!=='function')return{ok:false,reason:'player-state-authority-unavailable',coins:P.coins,exp:P.exp,wins:P.wins,knowledge:P.knowledge||0,serverProtected:false};const result=authority.applyOfflineBattleReward({authorityMode:'offline',snapshot:P,battleId:String(battleId||''),rewardId:String(rewardId||''),coins,exp,wins});";
          const appNew="grantBattleRewards:({battleId='',rewardId='',battleCreatedAt=0,coins=0,exp=0,wins=0}={})=>{const SEC=window.POWDER_SECURE_ECONOMY_V152;if(SEC?.hasAccount?.())return{ok:false,coins:P.coins,exp:P.exp,wins:P.wins,knowledge:P.knowledge||0,serverProtected:true,rewardLocked:true};const authority=window.POWDER_PLAYER_STATE_AUTHORITY_V1;if(typeof authority?.applyOfflineBattleReward!=='function')return{ok:false,reason:'player-state-authority-unavailable',coins:P.coins,exp:P.exp,wins:P.wins,knowledge:P.knowledge||0,serverProtected:false};const result=authority.applyOfflineBattleReward({authorityMode:'offline',snapshot:P,battleId:String(battleId||''),rewardId:String(rewardId||''),battleCreatedAt,coins,exp,wins});";
          replaceExact(appFile,appOld,appNew);

          // Combat entry: createdAt comes from the original BattleRequest and stays non-enumerable.
          const entryFile='js/combat-entry-v177.js';
          const entryOld="Object.defineProperties(battleRewardPayload,{battleId:{value:result.value.battleId,enumerable:false},rewardId:{value:String(reward.rewardId||''),enumerable:false}});";
          const entryNew="Object.defineProperties(battleRewardPayload,{battleId:{value:result.value.battleId,enumerable:false},rewardId:{value:String(reward.rewardId||''),enumerable:false},battleCreatedAt:{value:request.value.createdAt,enumerable:false}});";
          replaceExact(entryFile,entryOld,entryNew);

          // Verifier: preserve all prior cases, supply monotonic createdAt, then add final retention cases.
          const verifierFile='tools/verify-player-state-authority-v1.mjs';
          let verifier=fs.readFileSync(verifierFile,'utf8');
          const helperAnchor="function assertBalances(actual,coins,exp,wins,label){assert.equal(actual.coins,coins,`${label}: coins`);assert.equal(actual.exp,exp,`${label}: exp`);assert.equal(actual.wins,wins,`${label}: wins`);}\n";
          if(!verifier.includes(helperAnchor))throw new Error('verifier helper anchor missing');
          verifier=verifier.replace(helperAnchor,helperAnchor+"function reward(authority,input){reward.clock+=1;return authority.applyOfflineBattleReward({battleCreatedAt:reward.clock,...input});}\nreward.clock=1000;\n");
          verifier=verifier.replace(/([A-Za-z_$][\\w$]*)\\.applyOfflineBattleReward\\(/g,'reward($1,');
          const sourceMarker='// 11-14: source-level integration guards (when run from repository root).';
          if(!verifier.includes(sourceMarker))throw new Error('source verifier marker missing');
          const retentionTests=`// Final retention hardening: receipt eviction cannot resurrect an old reward.\n{\n  const storage=new FakeStorage();let snapshot=baseSave();seedStorage(storage,snapshot);const authority=boot(storage);\n  const a=authority.applyOfflineBattleReward({authorityMode:'offline',snapshot,battleId:'battle-evict-A',rewardId:'reward-A',battleCreatedAt:1000,coins:100,exp:0,wins:0});\n  assert.equal(a.ok,true);assertBalances(a.snapshot,600,10,2,'eviction A');snapshot=a.snapshot;\n  for(let i=1;i<=70;i++){const r=authority.applyOfflineBattleReward({authorityMode:'offline',snapshot,battleId:\`battle-evict-\${i}\`,battleCreatedAt:1000+i,coins:1,exp:0,wins:0});assert.equal(r.ok,true);snapshot=r.snapshot;}\n  const journal=JSON.parse(storage.getItem(\`\${STORAGE_KEY}_combat_reward_journal_v1\`));assert.ok(journal.records.length<=64);assert.equal(journal.records.some(x=>x.battleId==='battle-evict-A'),false,'A receipt must be evicted');\n  assertBalances(snapshot,670,10,2,'after 70 newer battles');const replay=authority.applyOfflineBattleReward({authorityMode:'offline',snapshot,battleId:'battle-evict-A',battleCreatedAt:1000,coins:100});\n  assert.equal(replay.ok,true);assert.equal(replay.duplicate,true);assert.equal(replay.stale,true);assert.equal(replay.reason,'battle-reward-stale-settled');assert.deepEqual(replay.granted,{coins:0,exp:0,wins:0});assertBalances(replay.snapshot,670,10,2,'evicted A replay');assertBalances(persisted(storage),670,10,2,'evicted A persisted');\n}\n\n// Boundary ordering: older is stale, newer settles.\n{\n  const storage=new FakeStorage();let snapshot=baseSave();seedStorage(storage,snapshot);const authority=boot(storage);\n  const b=authority.applyOfflineBattleReward({authorityMode:'offline',snapshot,battleId:'boundary-B',battleCreatedAt:200,coins:20});assert.equal(b.ok,true);snapshot=b.snapshot;\n  const a=authority.applyOfflineBattleReward({authorityMode:'offline',snapshot,battleId:'boundary-A',battleCreatedAt:100,coins:100});assert.equal(a.ok,true);assert.equal(a.stale,true);assertBalances(a.snapshot,520,10,2,'older A stale');\n  const c=authority.applyOfflineBattleReward({authorityMode:'offline',snapshot,battleId:'boundary-C',battleCreatedAt:300,coins:30});assert.equal(c.ok,true);assert.equal(c.duplicate,false);assertBalances(c.snapshot,550,10,2,'newer C settles');\n}\n\n// Equal boundary timestamp with same id is stale duplicate even without an exact journal receipt.\n{\n  const storage=new FakeStorage();const snapshot=baseSave();snapshot.saveMeta.battleRewardBoundary={version:1,battleCreatedAt:500,battleId:'boundary-X',settledAt:600};seedStorage(storage,snapshot);const authority=boot(storage);\n  const same=authority.applyOfflineBattleReward({authorityMode:'offline',snapshot,battleId:'boundary-X',battleCreatedAt:500,coins:100});assert.equal(same.ok,true);assert.equal(same.duplicate,true);assert.equal(same.stale,true);assertBalances(same.snapshot,500,10,2,'equal same id');\n}\n\n// Equal boundary timestamp with a different id fails closed.\n{\n  const storage=new FakeStorage();const snapshot=baseSave();snapshot.saveMeta.battleRewardBoundary={version:1,battleCreatedAt:500,battleId:'boundary-X',settledAt:600};seedStorage(storage,snapshot);const authority=boot(storage);\n  const collision=authority.applyOfflineBattleReward({authorityMode:'offline',snapshot,battleId:'boundary-Y',battleCreatedAt:500,coins:100});assert.equal(collision.ok,false);assert.equal(collision.reason,'battle-reward-boundary-collision');assertBalances(persisted(storage),500,10,2,'boundary collision');\n}\n\n// Brand-new reward claims without a canonical BattleRequest.createdAt fail closed.\n{\n  const storage=new FakeStorage();const snapshot=baseSave();seedStorage(storage,snapshot);const authority=boot(storage);\n  for(const battleCreatedAt of [undefined,NaN,0]){const r=authority.applyOfflineBattleReward({authorityMode:'offline',snapshot,battleId:\`missing-created-at-\${String(battleCreatedAt)}\`,battleCreatedAt,coins:100});assert.equal(r.ok,false);assert.equal(r.reason,'invalid-battle-created-at');assertBalances(persisted(storage),500,10,2,'missing createdAt');}\n}\n\n`;
          verifier=verifier.replace(sourceMarker,retentionTests+sourceMarker);
          const sourceOld="assert.ok(entry.includes('battleId:{value:result.value.battleId'),'current PVE settlement caller must plumb battleId');\nassert.ok(entry.includes(\"rewardId:{value:String(reward.rewardId||'')\"),'current PVE settlement caller must plumb rewardId');\nassert.ok(entry.includes('enumerable:false'),'battle identity plumbing must preserve the legacy enumerable reward payload shape');";
          const sourceNew=sourceOld+"\nassert.ok(entry.includes('battleCreatedAt:{value:request.value.createdAt'),'current PVE settlement caller must plumb BattleRequest.createdAt');\nassert.ok(grantBody.includes('battleCreatedAt=0'),'Main grantBattleRewards must accept battleCreatedAt');\nassert.ok(grantBody.includes('battleCreatedAt,coins,exp,wins'),'Main must pass battleCreatedAt into the shared authority');\nassert.ok(authoritySource.includes('battleRewardBoundary'),'authority must persist the battle reward high-watermark');\nassert.ok(authoritySource.includes('JOURNAL_LIMIT=64'),'recent exact receipt journal must remain bounded at 64');\nassert.equal(authoritySource.includes('result.finishedAt'),false,'boundary must not use BattleResult.finishedAt');\nassert.equal(/now\\.coins\\s*>=|now\\.exp\\s*>=|now\\.wins\\s*>=/.test(authoritySource),false,'balance arithmetic must not return as transaction identity');";
          if(!verifier.includes(sourceOld))throw new Error('source assertion anchor missing');
          verifier=verifier.replace(sourceOld,sourceNew);
          fs.writeFileSync(verifierFile,verifier);
          NODE

          node --check js/player-state-authority-v1.js
          node --check js/combat-entry-v177.js
          node --check js/app.js
          node --check tools/verify-player-state-authority-v1.mjs
          git diff --check

      - name: Check exact task scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          expected=$'js/app.js\njs/combat-entry-v177.js\njs/player-state-authority-v1.js\ntools/verify-player-state-authority-v1.mjs'
          actual="$(printf '%s\n' "${changed[@]}")"
          printf 'Changed before validation:\n%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Install dependencies
        run: npm ci

      - name: Targeted authority verifier
        run: node tools/verify-player-state-authority-v1.mjs

      - name: Combat2 PVE handoff regression
        run: node tools/verify-combat2-pve-handoff.mjs

      - name: Player Test Readiness regression
        run: node tools/verify-player-test-readiness.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Static and diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'battleCreatedAt:{value:request.value.createdAt' js/combat-entry-v177.js
          grep -Fq 'battleRewardBoundary' js/player-state-authority-v1.js
          grep -Fq 'JOURNAL_LIMIT=64' js/player-state-authority-v1.js
          grep -Fq "reason:'invalid-battle-created-at'" js/player-state-authority-v1.js
          grep -Fq "reason:'battle-reward-boundary-collision'" js/player-state-authority-v1.js
          ! grep -Fq 'result.finishedAt' js/player-state-authority-v1.js
          ! grep -Fq "P.coins=Math.max(0,P.coins+coins);P.exp=Math.max(0,P.exp+Math.floor(Number(exp)||0));P.wins=Math.max(0,P.wins+Math.floor(Number(wins)||0));" js/app.js

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "QuangThai2002"
          git config user.email "134858800+QuangThai2002@users.noreply.github.com"
          git rm .github/workflows/task-02a1-retention-executor.yml
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=$'.github/workflows/task-02a1-retention-executor.yml\njs/app.js\njs/combat-entry-v177.js\njs/player-state-authority-v1.js\ntools/verify-player-state-authority-v1.mjs'
          actual="$(printf '%s\n' "${changed[@]}")"
          printf 'Commit scope:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git add js/app.js js/combat-entry-v177.js js/player-state-authority-v1.js tools/verify-player-state-authority-v1.mjs
          git diff --cached --check
          git commit -m "fix(state): prevent stale battle reward replay"
          git push origin HEAD:work/adventure-combat-entry-user-test-v1
