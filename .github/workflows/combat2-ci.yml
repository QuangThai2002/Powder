name: Combat 2 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'combat2.html'
      - 'src/game/combat2/**'
      - 'js/data.js'
      - 'assets/pow-beta12/**'
      - 'tools/audit-pow-assets.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/combat2-ci.yml'
  push:
    branches: [main]
    paths:
      - 'combat2.html'
      - 'src/game/combat2/**'
      - 'js/data.js'
      - 'assets/pow-beta12/**'
      - 'tools/audit-pow-assets.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/combat2-ci.yml'
  workflow_dispatch:

concurrency:
  group: combat2-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  combat2-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck build and canonical asset audit
        run: npm run check
