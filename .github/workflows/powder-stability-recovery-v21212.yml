name: Powder Stability Recovery 21.2.12

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - 'service-worker.js'
      - 'index.html'
      - 'tools/powder-stability-recovery-gate-v21212.mjs'
      - '.github/workflows/powder-stability-recovery-v21212.yml'
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - 'service-worker.js'
      - 'index.html'
      - 'tools/powder-stability-recovery-gate-v21212.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check recovery JavaScript
        run: |
          node --check js/adaptive-runtime-pressure-v21011.js
          node --check js/combat-content-ui-v1890.js
          node --check js/combat-entry-v177.js
          node --check js/combat-presentation-v21015.js
          node --check js/full-game-regression-v20180.js
          node --check js/learning-hub-v149.js
          node --check js/learning-srs-intelligence-v2114.js
          node --check js/progression-unlocks-v1782.js
          node --check js/secure-learning-v176.js
          node --check js/skill-loadout.js
          node --check service-worker.js

      - name: Run Stability Recovery Gate
        run: node tools/powder-stability-recovery-gate-v21212.mjs

      - name: Verify protected canonical audio is untouched
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=2
            if git diff --name-only origin/main...HEAD | grep -E '^(assets/audio/combat/user-combat-bgm\.mp3|assets/audio/domain/domain-voice-usercut-[1-4]\.m4a)$'; then
              echo 'Protected canonical audio changed unexpectedly.'
              exit 1
            fi
          fi
          git diff --exit-code
