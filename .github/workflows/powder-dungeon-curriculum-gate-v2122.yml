name: Powder Dungeon Curriculum Gate 21.2.2

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/learning-dungeon-curriculum-gate-v2122.js'
      - 'js/learning-srs-intelligence-v2114.js'
      - 'tools/powder-dungeon-curriculum-gate-v2122.mjs'
      - '.github/workflows/powder-dungeon-curriculum-gate-v2122.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: powder-dungeon-curriculum-gate-v2122-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Syntax guard
        run: |
          node --check js/learning-dungeon-curriculum-gate-v2122.js
          node --check tools/powder-dungeon-curriculum-gate-v2122.mjs
      - name: Critical path isolation
        run: git diff --exit-code origin/main...HEAD -- index.html js/boot-loader-v21004.js js/app.js
      - name: Dungeon Curriculum Gate regression
        run: node tools/powder-dungeon-curriculum-gate-v2122.mjs .
      - name: Daily Boss regression
        run: node tools/powder-daily-boss-intelligence-gate-v2121.mjs .
      - name: Learning Command Center regression
        run: node tools/powder-learning-command-center-gate-v2120.mjs .
      - name: Daily rotation regression
        run: node tools/powder-daily-rotation-runner-gate-v2119.mjs .
      - name: Mastery recovery regression
        run: node tools/powder-mastery-recovery-gate-v2116.mjs .
      - name: SRS regression
        run: node tools/powder-srs-intelligence-gate-v2114.mjs .
      - name: Final regression gate
        run: node tools/powder-final-gate-v21004.mjs .
