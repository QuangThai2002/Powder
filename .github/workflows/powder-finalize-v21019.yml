name: Powder 21.0.19 Finalize

on:
  push:
    branches:
      - upgrade/21.0.19-combat-warmup-zero-stutter

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v21019-finalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/21.0.19-combat-warmup-zero-stutter
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch final gate for 21.0.19
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const f='tools/powder-final-gate-v21004.mjs';
          let s=fs.readFileSync(f,'utf8');
          const must=(from,to)=>{if(!s.includes(from))throw new Error('Missing anchor: '+from.slice(0,100));s=s.replace(from,to)};
          must('manifest.length===1289','manifest.length===1290');
          must("combatSkillIdentityIndex=order.indexOf('js/combat-skill-identity-v21018.js'),combatEntryIndex=order.indexOf('js/combat-entry-v177.js');ok", "combatSkillIdentityIndex=order.indexOf('js/combat-skill-identity-v21018.js'),combatEntryIndex=order.indexOf('js/combat-entry-v177.js'),combatWarmupIndex=order.indexOf('js/combat-warmup-v21019.js');ok");
          must('order.length===129&&seq.every','order.length===130&&seq.every');
          must('combatEntryIndex===combatSkillIdentityIndex+1,{count:order.length', 'combatEntryIndex===combatSkillIdentityIndex+1&&combatWarmupIndex===combatEntryIndex+1,{count:order.length');
          must('combatSkillIdentityIndex,combatEntryIndex});', 'combatSkillIdentityIndex,combatEntryIndex,combatWarmupIndex});');
          must("combatSkillIdentityCss=read('css/combat-skill-identity-v21018.css'),liveOpsSource=read('js/live-ops-diagnostics-v2020.js');", "combatSkillIdentityCss=read('css/combat-skill-identity-v21018.css'),combatWarmupSource=read('js/combat-warmup-v21019.js'),liveOpsSource=read('js/live-ops-diagnostics-v2020.js');");
          const marker="\nconst refresh=spawnSync(process.execPath,[path.join(root,'tools/powder-refresh-boot-manifest-v21018.mjs'),root],{encoding:'utf8'});";
          if(!s.includes(marker))throw new Error('Refresh anchor missing');
          const check="\nok('combatWarmupIntegration',combatWarmupSource.includes(\"VERSION='21.0.19'\")&&combatWarmupSource.includes('POWDER_COMBAT_ENTRY_V177')&&combatWarmupSource.includes('POWDER_SCENE_TRANSITION_V21012')&&combatWarmupSource.includes('POWDER_SKILL_ART')&&combatWarmupSource.includes('stage?.enemyIds')&&combatWarmupSource.includes('img.decode')&&combatWarmupSource.includes(\"level==='critical'\")&&!combatWarmupSource.includes('MutationObserver')&&!combatWarmupSource.includes('setInterval')&&liveOpsSource.includes('v21019')&&liveOpsSource.includes('POWDER_COMBAT_WARMUP_V21019')&&manifest.some(x=>x.u==='js/combat-warmup-v21019.js'&&x.k==='script'),{warmupAfterFrozenEntry:combatWarmupIndex===combatEntryIndex+1,manifestEntry:manifest.find(x=>x.u==='js/combat-warmup-v21019.js')||null});";
          s=s.replace(marker,check+"\nconst refresh=spawnSync(process.execPath,[path.join(root,'tools/powder-refresh-boot-manifest-v21019.mjs'),root],{encoding:'utf8'});");
          fs.writeFileSync(f,s);
          NODE
      - name: Refresh boot integration
        run: node tools/powder-refresh-boot-manifest-v21019.mjs . --write
      - name: Validate generated files
        run: |
          node --check js/combat-warmup-v21019.js
          node --check tools/powder-combat-warmup-gate-v21019.mjs
          node --check tools/powder-final-gate-v21004.mjs
          node tools/powder-refresh-boot-manifest-v21019.mjs .
      - name: Commit final integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/boot-loader-v21004.js tools/powder-final-gate-v21004.mjs
          if git diff --cached --quiet; then
            echo "21.0.19 generated integration already current"
            exit 0
          fi
          git commit -m "build: bind 21.0.19 combat warmup [v21019-finalize]"
          git push origin HEAD:upgrade/21.0.19-combat-warmup-zero-stutter
