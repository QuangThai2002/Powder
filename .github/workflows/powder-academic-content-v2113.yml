name: Powder Academic Content

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  academic-content:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source
        run: |
          node --check js/learning-academic-content-v2113.js
          node --check js/learning-question-engine-v2112.js
          node --check tools/powder-academic-content-gate-v2113.mjs
          node --check tools/powder-refresh-boot-manifest-v2113.mjs
          node tools/powder-refresh-boot-manifest-v2113.mjs .
      - name: Run academic content gate
        run: node tools/powder-academic-content-gate-v2113.mjs .
      - name: Upload academic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powder-academic-content-${{ github.sha }}
          path: artifacts/academic-content-v2113/
          if-no-files-found: warn
          retention-days: 14
