name: Temporary Boot Fix 21.0.7

on:
  push:
    branches: [upgrade/21.0.7-browser-e2e]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'QuangThai2002'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/21.0.7-browser-e2e
      - name: Patch TOTAL_BYTES from manifest
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/boot-loader-v21004.js')
          text = p.read_text(encoding='utf-8')
          if 'const TOTAL_BYTES=' not in text:
              needle = '\nconst SCRIPT_ORDER='
              assert needle in text, 'SCRIPT_ORDER anchor not found'
              text = text.replace(needle, '\nconst TOTAL_BYTES=MANIFEST.reduce((sum,a)=>sum+(Number(a.s)||0),0);\nconst SCRIPT_ORDER=', 1)
              p.write_text(text, encoding='utf-8', newline='\n')
      - name: Verify syntax and patch
        run: |
          node --check js/boot-loader-v21004.js
          grep -F "const TOTAL_BYTES=MANIFEST.reduce" js/boot-loader-v21004.js
      - name: Commit patch
        run: |
          git config user.name "Powder CI"
          git config user.email "actions@users.noreply.github.com"
          git add js/boot-loader-v21004.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "21.0.7: fix boot TOTAL_BYTES initialization"
          git push origin HEAD:upgrade/21.0.7-browser-e2e
