<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="powder-combat-version" content="2.3.1" />
  <meta name="theme-color" content="#050c15" />
  <title>Powder Combat 2.3.1</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
      background: #050c15; touch-action: none;
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    }
    body {
      min-width: 100vw; min-height: 100vh; min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #powder-combat2 {
      width: 100%; height: 100%;
      min-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      touch-action: none; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    #powder-combat2 canvas {
      display: block; margin: 0 auto; max-width: 100%; max-height: 100%; touch-action: none;
    }
  </style>
</head>
<body>
  <div id="powder-combat2"></div>
  <script type="module" src="/src/game/combat2/bootstrap.ts"></script>
</body>
</html>
